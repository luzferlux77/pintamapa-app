<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi progreso · PintaMapa</title>
  <link rel="stylesheet" href="lib/maplibre/maplibre-gl.css">
  <style>
    /* Mismo aspecto que la app: interfaz sobria en azul (--accent) y TU color de pintura (--paint) solo para lo pintado.
       Letra del sistema, como el juego (antes se bajaba Inter de Google y todo era otro azul). */
    :root {
      --bg: #f4f5f7; --card: #ffffff; --line: #e7e9ee; --soft-bg: #f3f4f7; --text: #1a1d29; --muted: #4b5563; --soft: #8a91a0;
      --accent: #1f5fbf; --paint: #ff2e88; --up: #059669; --down: #dc2626;
      --r: 16px; --shadow: 0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
    button { font: inherit; cursor: pointer; }
    .muted { color: var(--muted); }
    .logo { font-weight: 800; letter-spacing: -1px; font-size: 30px; } .logo .p { color: var(--text); } .logo .m { color: var(--accent); }   /* (la misma marca que en la app) */
    /* ----- acceso ----- */
    #login { min-height: 100%; display: grid; place-items: center; padding: 24px; }
    .login-card { width: min(400px, 100%); background: var(--card); border-radius: 22px; padding: 32px 28px; box-shadow: 0 10px 40px rgba(16,24,40,.08); text-align: center; }
    .login-card h1 { font-size: 20px; margin: 18px 0 6px; } .login-card p { font-size: 14px; line-height: 1.5; margin: 0 0 18px; }
    .login-card input { width: 100%; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--line); background: #fafbfc; font: inherit; margin-bottom: 10px; outline: none; }
    .login-card input:focus { border-color: var(--accent); background: #fff; }
    .btn-main { width: 100%; padding: 13px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font-weight: 700; font-size: 15px; }
    .err { color: var(--down); font-size: 13px; min-height: 18px; margin-top: 10px; }
    .howto { text-align: left; background: var(--soft-bg); border-radius: 12px; padding: 12px 14px; font-size: 13px; line-height: 1.55; margin-top: 12px; }
    .howto ol { padding-left: 18px; margin: 6px 0; }
    /* ----- app: mapa a la izquierda, panel a la derecha ----- */
    #app { display: none; height: 100vh; grid-template-columns: minmax(0, 1fr) 460px; grid-template-rows: 64px minmax(0, 1fr); }
    #app.show { display: grid; }
    header { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 0 20px; background: var(--card); border-bottom: 1px solid var(--line); }
    .who { display: flex; align-items: center; gap: 12px; margin-left: 8px; min-width: 0; }
    .ring { --p: 0; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 15px; flex: none;
      background: conic-gradient(var(--accent) calc(var(--p) * 1%), #eceef3 0); position: relative; }
    .ring::before { content: ''; position: absolute; inset: 4px; border-radius: 50%; background: #fff; }
    .ring b { position: relative; }
    #avatar { width: 40px; height: 40px; border-radius: 50%; background: center / cover; box-shadow: 0 0 0 2px #fff, 0 0 0 3px var(--line); flex: none; }
    .who-txt { min-width: 0; } .who-txt b { display: block; font-size: 15px; } .who-txt small { color: var(--muted); font-size: 12px; }
    .grow { flex: 1; }
    #synced { font-size: 12px; color: var(--muted); white-space: nowrap; }
    .hbtn { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 12px; font-size: 13px; font-weight: 600; color: var(--text); text-decoration: none; }
    .hbtn:hover { border-color: #d6d9e0; }
    .mapwrap { position: relative; min-height: 0; }
    #bigmap { position: absolute; inset: 0; background: #e9ebf0; }
    .layers { position: absolute; z-index: 500; top: 14px; left: 14px; display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100% - 120px); }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,.97); border-radius: 99px; padding: 7px 12px; font-size: 12.5px; font-weight: 600; color: var(--muted); box-shadow: var(--shadow); }
    .chip.on { color: var(--text); border-color: var(--text); }
    .chip i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
    .fitbtn { position: absolute; z-index: 500; right: 14px; top: 14px; }
    .lmk { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 17px; background: #fff; border: 3px solid var(--c, #9aa4b2); box-shadow: 0 2px 6px rgba(0,0,0,.2); }
    /* ----- panel ----- */
    aside { overflow-y: auto; border-left: 1px solid var(--line); background: var(--bg); padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .tabs { display: flex; gap: 4px; background: #e9ebf0; padding: 4px; border-radius: 12px; position: sticky; top: -16px; z-index: 5; }
    .tabs button { flex: 1; border: 0; background: transparent; padding: 9px 6px; border-radius: 9px; font-size: 13.5px; font-weight: 600; color: var(--muted); }
    .tabs button.on { background: #fff; color: var(--text); box-shadow: var(--shadow); }
    #panel { display: flex; flex-direction: column; gap: 14px; }
    .card { background: var(--card); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); }
    .card h3 { margin: 0 0 12px; font-size: 15px; font-weight: 700; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .card h3 span { font-size: 12px; font-weight: 500; color: var(--soft); }
    .empty { color: var(--muted); font-size: 13.5px; text-align: center; padding: 18px 8px; }
    .dl { font-size: 11px; font-weight: 700; } .dl.up { color: var(--up); } .dl.down { color: var(--down); }
    .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 11.5px; color: var(--muted); margin-top: 8px; }
    .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
    .row:last-child { border-bottom: 0; } .row span { color: var(--muted); } .row b { font-variant-numeric: tabular-nums; white-space: nowrap; }
    /* resumen: los totales, una sola vez */
    .totales { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .totales div { background: var(--card); border-radius: 14px; padding: 12px 8px; text-align: center; box-shadow: var(--shadow); }
    .totales b { display: block; font-size: 21px; font-weight: 800; letter-spacing: -.3px; font-variant-numeric: tabular-nums; }
    .totales small { color: var(--muted); font-size: 11.5px; } .totales .pintado b { color: var(--paint); }
    .desde { margin: -4px 2px 0; font-size: 12.5px; color: var(--muted); }
    .wk3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
    .wk3 b { display: block; font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; } .wk3 small { display: block; color: var(--muted); font-size: 11.5px; }
    .wkbars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; height: 104px; align-items: end; }
    .wkbars div { display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; }
    .wkbars span { position: relative; flex: 1; width: 100%; max-width: 34px; background: var(--soft-bg); border-radius: 8px; overflow: hidden; }
    .wkbars span i, .wkbars span em { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 8px; } .wkbars span i { background: #cfd5e0; } .wkbars span em { background: var(--paint); }
    .wkbars small { font-size: 11px; color: var(--muted); font-weight: 600; } .wkbars .today small { color: var(--text); font-weight: 800; } .wkbars .fut span { opacity: .45; }
    .terr { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; } .terr b { display: block; font-size: 13px; margin-top: 6px; overflow-wrap: anywhere; } .terr small { color: var(--muted); font-size: 11px; }
    .more { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; } .more span { background: var(--soft-bg); border-radius: 99px; padding: 4px 10px; font-size: 12px; color: var(--muted); }
    .proy { margin: 12px 0 0; font-size: 13px; line-height: 1.45; color: var(--muted); }
    .goal { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); } .goal:last-child { border-bottom: 0; }
    .goal > span { font-size: 22px; width: 30px; text-align: center; } .goal > div { flex: 1; min-width: 0; } .goal b { font-size: 13.5px; } .goal small { display: block; color: var(--muted); font-size: 11.5px; }
    .goal em { font-style: normal; font-weight: 800; font-size: 13px; color: var(--accent); width: 40px; text-align: right; }
    .pbar { height: 7px; border-radius: 99px; background: var(--soft-bg); overflow: hidden; margin: 6px 0 2px; } .pbar i { display: block; height: 100%; border-radius: 99px; background: var(--accent); }
    .recs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; } .rec { display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: 12px; background: var(--soft-bg); }
    .rec[data-wi] { cursor: pointer; } .rec[data-wi]:hover { background: #eaecf1; }
    .rec span { font-size: 20px; } .rec div { flex: 1; min-width: 0; } .rec small { display: block; color: var(--muted); font-size: 11.5px; } .rec b { font-size: 15px; } .rec em { font-style: normal; font-size: 11px; color: var(--muted); }
    /* paseos */
    .seg { display: flex; gap: 4px; background: #e9ebf0; padding: 4px; border-radius: 12px; }
    .seg button { flex: 1; border: 0; background: transparent; padding: 7px 4px; border-radius: 9px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
    .seg button.on { background: #fff; color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .kpi { background: var(--card); border-radius: 14px; padding: 12px; box-shadow: var(--shadow); }
    .kpi b { display: block; font-size: 19px; font-weight: 800; letter-spacing: -.3px; font-variant-numeric: tabular-nums; } .kpi small { color: var(--muted); font-size: 11.5px; }
    .calhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; } .calhead b { font-size: 16px; } .calhead b::first-letter { text-transform: uppercase; }
    .calnav { border: 1px solid var(--line); background: #fff; width: 34px; height: 34px; border-radius: 10px; font-size: 18px; }
    .calgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; }
    .calgrid small { color: var(--muted); font-size: 11.5px; font-weight: 600; padding-bottom: 2px; }
    .cd { position: relative; aspect-ratio: 1; border: 0; border-radius: 10px; background: var(--soft-bg); color: var(--muted); font-size: 13px; font-weight: 600; }
    .cd.on { background: color-mix(in srgb, var(--paint) calc(var(--a) * 100%), #fff); color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.25); }
    .cd.on:hover { transform: scale(1.06); } .cd.sel { outline: 3px solid var(--text); outline-offset: 1px; } .cd.today { box-shadow: inset 0 0 0 2px var(--accent); }
    .cd:disabled { cursor: default; } .cd i { position: absolute; top: 2px; right: 4px; font-style: normal; font-size: 9.5px; }
    .calsum { margin: 10px 0 0; font-size: 13px; color: var(--muted); }
    .walk { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 11px 12px; border-radius: 12px; cursor: pointer; border: 1px solid transparent; }
    .walk:hover { background: var(--soft-bg); } .walk.sel { border-color: var(--accent); background: #f2f6fd; }
    .walk b { font-size: 13.5px; } .walk b::first-letter { text-transform: uppercase; } .walk .pts { color: var(--accent); font-weight: 700; font-size: 13px; text-align: right; }
    .walk small { color: var(--muted); font-size: 12px; grid-column: 1 / -1; }
    .wdet { margin-top: 8px; justify-self: start; border: 1px solid var(--line); background: #fff; color: inherit; border-radius: 9px; padding: 7px 12px; font-size: 13px; font-weight: 600; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .hbars div { display: grid; grid-template-columns: 30px 1fr 50px; align-items: center; gap: 8px; margin: 5px 0; font-size: 12.5px; }
    .hbars i { height: 10px; background: var(--soft-bg); border-radius: 6px; overflow: hidden; } .hbars em { display: block; height: 100%; background: #b9c4d8; border-radius: 6px; }
    .hbars .hi em { background: var(--accent); } .hbars .hi span, .hbars .hi b { font-weight: 800; } .hbars b { text-align: right; font-weight: 600; color: var(--muted); }
    svg text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    /* colección */
    .coltop { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
    .coltop b { display: block; font-size: 21px; font-weight: 800; } .coltop small { color: var(--muted); font-size: 11.5px; }
    .stackbar { display: flex; height: 10px; border-radius: 99px; overflow: hidden; margin-top: 14px; gap: 2px; }
    .ach { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; }
    .ach div { text-align: center; font-size: 10.5px; color: var(--muted); }
    .ach div span { display: grid; place-items: center; width: 44px; height: 44px; margin: 0 auto 4px; border-radius: 12px; background: var(--soft-bg); font-size: 22px; }
    .ach div.off span { filter: grayscale(1); opacity: .35; }
    .logros summary { list-style: none; cursor: pointer; } .logros summary::-webkit-details-marker { display: none; } .logros:not([open]) h3 { margin: 0; } .logros[open] summary span::after { content: " ▴"; }
    #album-box { --panel: var(--card); --ab-tope: 34px; --ab-lado: 0px; --ab-lado-p: 0px; scroll-margin-top: 44px; }   /* (la barra del álbum, justo debajo de las pestañas fijas) */
    #album-box .cromos { display: grid; grid-template-columns: repeat(auto-fill, minmax(146px, 1fr)); gap: 10px; }
    #album-box .cromos .tcg-cell { --w: 146px; } #album-box .cromos .tcg.mini { font-size: calc(var(--w) / 26); }
    /* álbumes a pantalla completa: portadas en rejilla, la ciudad a dos columnas y las cartas más grandes */
    #alb-full { position: fixed; inset: 0; z-index: 2500; display: none; flex-direction: column; background: var(--bg); --ab-fondo: var(--bg); }
    #alb-full.show { display: flex; }
    .af-top { display: flex; align-items: center; gap: 14px; padding: 10px 24px; background: var(--card); border-bottom: 1px solid var(--line); }
    .af-top b { flex: 1; font-size: 18px; }
    #af-body { flex: 1; min-height: 0; overflow: auto; padding: 24px; }
    #alb-full #album-box { max-width: 1500px; margin: 0 auto; --ab-tope: 0px; scroll-margin-top: 0; }
    #alb-full [data-vista="inicio"] { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); gap: 18px; align-items: start; }
    #alb-full [data-vista="inicio"] h4 { grid-column: 1 / -1; margin: 0; }
    #alb-full [data-vista="inicio"] .ab-fila { margin: 0; }
    @media (max-width: 899px) { #af-body { padding: 12px; } .af-top { padding: 8px 12px; } }
    @media (min-width: 900px) {
      #alb-full #album-box .cromos { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px; }
      #alb-full #album-box .cromos .tcg-cell { --w: 190px; }
      /* el álbum de una ciudad, en grande: la foto más alta y cromos más grandes */
      #alb-full .ab-cab { height: 220px; } #alb-full .ab-cab .ab-tit b { font-size: 48px; } #alb-full .ab-cab .ab-tit b.largo { font-size: 36px; }
      #alb-full .ab-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; } #alb-full .ab-c b { font-size: 13.5px; }
      #alb-full .ab-chips, #alb-full .ab-saltos { flex-wrap: wrap; overflow: visible; margin-left: 0; margin-right: 0; padding: 0; }
    }
    /* ventana estrecha (o el móvil): todo en una columna, el mapa arriba */
    @media (max-width: 980px) {
      #app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 55vh auto; height: auto; }
      header { flex-wrap: wrap; gap: 8px; padding: 8px 10px 6px; } header .grow { display: none; } header .logo { margin-right: auto; }
      .who { order: 5; width: 100%; margin-left: 0; }   /* (tu nombre, en su propia fila: los botones lo tapaban) */
      header .logo { font-size: 19px !important; } .who-txt small { display: none; } header .ring { width: 38px; height: 38px; }
      #synced { order: 9; width: 100%; font-size: 11px; }
      #reload, header a.hbtn { font-size: 0 !important; } #reload::before { content: '↻'; font-size: 17px; } header a.hbtn::before { content: '🕹️'; font-size: 16px; }
      aside { border-left: 0; overflow: visible; min-width: 0; padding: 12px; }
      aside > *, .card { min-width: 0; max-width: 100%; }
      html, body { overflow-x: hidden; }
      .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .totales { grid-template-columns: repeat(2, 1fr); } .grid2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="login">
    <div class="login-card">
      <div class="logo" translate="no"><span class="p">Pinta</span><span class="m">Mapa</span></div>
      <h1>Mi progreso</h1>
      <p class="muted">Todo lo que pintas por la calle, cifrado en la nube. Entra con tu nombre de pintor y la contraseña de la app (Perfil → Mi cuenta en la nube).</p>
      <input id="user" placeholder="Nombre de pintor" autocomplete="username">
      <input id="pass" type="password" placeholder="Contraseña" autocomplete="current-password">
      <button class="btn-main" id="go">Ver mi progreso</button>
      <div id="who"></div>
      <div class="err" id="err"></div>
    </div>
  </div>

  <div id="app">
    <header>
      <div class="logo" translate="no" style="font-size:24px"><span class="p">Pinta</span><span class="m">Mapa</span></div>
      <div class="who"><div class="ring" id="ring"><b id="lvl">1</b></div><div class="who-txt"><b id="name"></b><small id="lvltext"></small></div></div>
      <div class="grow"></div>
      <small id="synced"></small>
      <button class="hbtn" id="reload">↻ Actualizar</button>
      <a class="hbtn" href="index.html">🕹️ Jugar</a>
      <button class="hbtn" id="logout">Salir</button>
    </header>
    <div class="mapwrap">
      <div id="bigmap"></div>
      <div class="layers" id="layers"></div>
      <button class="chip fitbtn" id="fit">⤢ Ver todo</button>
    </div>
    <aside>
      <div class="tabs" id="tabs">
        <button data-t="res" class="on">Resumen</button>
        <button data-t="pas">Paseos</button>
        <button data-t="col">Colección</button>
      </div>
      <div id="panel"></div>
    </aside>
  </div>

  <div id="alb-full"><div class="af-top"><b>📖 <span>Mis álbumes</span></b><button class="hbtn" id="af-x">✕ Salir</button></div><div id="af-body"></div></div>

  <script src="lib/maplibre/maplibre-gl.js"></script>
  <script src="js/version.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/i18n-dict.js"></script>
  <script src="js/util.js"></script>
  <script src="js/clases-auto.js"></script>
  <script src="js/wikidata.js"></script>
  <script src="js/vtiles.js"></script>
  <script src="js/mapstyle.js"></script>
  <script src="js/lugares.js"></script>
  <script src="js/precarga-formato.js"></script>
  <script src="js/world.js"></script>
  <script src="js/game.js"></script>
  <script src="js/merge.js"></script>
  <script src="js/sync.js"></script>
  <script src="lib/html-to-image.js"></script>
  <script src="js/tcg.js"></script>
  <script src="js/album.js"></script>
  <script src="lib/mp4-muxer.js"></script>
  <script src="js/replay.js"></script>
  <script>
  (function () {
    const $ = (s) => document.querySelector(s);
    const KEY = 'pintamapa_dash';
    const MIN_WALK = 120000;   // los paseos de menos de 2 minutos no cuentan
    let creds = {}; try { creds = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
    let data, map, tab = 'res', fitBounds = null, calMonth = null, calDay = null, actPeriod = 'd30';
    const esc = (t) => String(t == null ? '' : t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const km = (m) => PM.dec(m / 1000, m >= 10000 ? 1 : 2);
    const dist = (m) => PM.fmtDist(m || 0);
    const dur = (ms) => { const m = Math.round(ms / 60000); return m >= 60 ? Math.floor(m / 60) + ' h ' + (m % 60) + ' min' : m + ' min'; };
    const pace = (ms, m) => { if (!m || m < 50) return '—'; const s = Math.round(ms / 1000 / (m / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') + ' /km'; };
    const dayKey = (t) => { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
    const RAR = PM.world.RARITY;
    const mov = (w) => PM.movingMs(w);
    const RAR_C = { comun: '#9aa4b2', raro: '#3fa9ff', epico: '#b65cff', legendario: '#ffb700' };

    // ---------------- acceso ----------------
    async function load() {
      $('#err').textContent = ''; $('#who').innerHTML = '';
      try {
        if (!creds.user || !creds.pass) throw new Error('Pon tu nombre de pintor y tu contraseña');
        $('#go').textContent = 'Descifrando…';
        let r;
        try { r = await PM.cloud.load(creds.user, creds.pass); }
        catch (e) { throw new Error(e.name === 'OperationError' ? 'Contraseña incorrecta' : (e.message || 'Error')); }
        if (!r) {
          $('#who').innerHTML = `<div class="howto"><b>No encuentro la partida de «${esc(creds.user)}» con esa contraseña.</b><ol>
            <li>Revisa nombre y contraseña (las mayúsculas cuentan).</li>
            <li>En el móvil: tu nombre → arriba <b>📡 Real</b> → <b>🎨 Perfil → ☁️ Mi cuenta en la nube</b> → contraseña → <b>Activar y guardar</b>.</li></ol></div>`;
          return;
        }
        localStorage.setItem(KEY, JSON.stringify(creds));
        data = { save: r.save, geo: r.geo, photo: r.photo };
        $('#login').style.display = 'none'; $('#app').classList.add('show');
        analyze(); header(); drawMap(); drawPanel();
      } catch (e) {
        $('#err').textContent = e.message === 'Failed to fetch' ? 'Sin conexión' : e.message;
      } finally { $('#go').textContent = 'Ver mi progreso'; }
    }
    $('#go').addEventListener('click', () => { creds = { user: $('#user').value.trim(), pass: $('#pass').value }; load(); });
    $('#pass').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#go').click(); });
    $('#logout').addEventListener('click', () => { localStorage.removeItem(KEY); location.reload(); });
    $('#reload').addEventListener('click', load);
    if (creds.user && creds.pass) { $('#user').value = creds.user; load(); }

    // ---------------- análisis (una sola vez al cargar; las pestañas solo lo enseñan) ----------------
    let A = {};
    function analyze() {
      const s = data.save, st = s.stats || {};
      const walks = (s.walks || []).filter((w) => (w.elapsed || 0) >= MIN_WALK).sort((a, b) => b.start - a.start);   // (más reciente primero)
      const days = {};
      walks.forEach((w) => { const d = days[dayKey(w.start)] || (days[dayKey(w.start)] = { walked: 0, painted: 0 }); d.walked += w.st.walked || 0; d.painted += w.st.painted || 0; });
      // racha más larga (días seguidos con paseo)
      let maxStreak = 0, cur = 0, prev = null;
      for (const k of Object.keys(days).sort()) { const t = new Date(k + 'T12:00').getTime(); cur = prev != null && Math.round((t - prev) / 86400000) === 1 ? cur + 1 : 1; maxStreak = Math.max(maxStreak, cur); prev = t; }
      // a qué hora y qué días sales (km)
      const hours = new Array(24).fill(0), wdays = new Array(7).fill(0);
      walks.forEach((w) => { const d = new Date(w.start); hours[d.getHours()] += (w.st.walked || 0) / 1000; wdays[(d.getDay() + 6) % 7] += (w.st.walked || 0) / 1000; });
      // récords (el ritmo, solo de paseos de más de 500 m con hora en cada punto: los demás no lo saben medir)
      const mejor = (ws, f) => ws.slice().sort((a, b) => f(b) - f(a))[0];
      const conHora = walks.filter((w) => (w.st.walked || 0) > 500 && (w.track || []).some((q) => q && q[2] != null));
      const recs = { largo: mejor(walks, (w) => w.st.walked || 0), nuevas: mejor(walks, (w) => w.st.painted || 0), rapido: mejor(conHora, (w) => -(mov(w) / w.st.walked)) };
      const bestDay = Object.entries(days).sort((a, b) => b[1].painted - a[1].painted)[0];
      // ciudades: lo pintado en cada una y su total
      const byCity = {};
      for (const [k, v] of Object.entries(s.tileNames || {})) if (v.city) byCity[v.city] = (byCity[v.city] || 0) + ((s.paintedByTile || {})[k] || 0);
      const cities = Object.entries(byCity).filter(([, m]) => m > 0).map(([c, m]) => {
        const tot = s.cities && s.cities[c] && s.cities[c].total;
        return { c, m, tot, pct: tot ? m / tot : 0, won: !!(s.citiesWon || {})[c] };
      }).sort((a, b) => b.m - a.m);
      // calles nuevas al día en los últimos 30 días (para calcular cuándo conquistarás la siguiente ciudad)
      const desde30 = Date.now() - 30 * 86400000;
      const perDay = walks.filter((w) => w.start >= desde30).reduce((a, w) => a + (w.st.painted || 0), 0) / 30;
      const lms = Object.entries(s.landmarks || {}).map(([id, v]) => Object.assign({ id }, v));
      A = { s, st, walks, days, maxStreak, hours, wdays, recs, bestDay, cities, perDay, lms, LI: PM.levelInfo(s.xp) };
    }

    // cabecera: tu nombre, tu nivel (el único sitio donde sale) y cuándo llegaron los últimos datos
    function header() {
      const { s, LI } = A;
      $('#ring').style.setProperty('--p', (LI.pct * 100).toFixed(1)); $('#lvl').textContent = LI.short; $('#lvl').style.color = LI.tier ? LI.tier.color : '';
      $('#name').textContent = s.player || creds.user;
      let av = document.getElementById('avatar');   // tu foto de perfil (de la app)
      if (s.avatar) { if (!av) { av = document.createElement('div'); av.id = 'avatar'; $('.who').insertBefore(av, $('.who-txt')); } av.style.backgroundImage = `url('${s.avatar}')`; }
      else if (av) av.remove();
      $('#lvltext').textContent = `Nivel ${LI.label}${LI.tier ? ' ' + LI.tier.icon : ''} · ${PM.fmtNum(s.xp || 0)} puntos · ` + (LI.max ? '¡nivel máximo!' : `faltan ${PM.fmtNum(LI.need - LI.cur)} para el ${LI.nextLabel}`);
      const ult = Math.max(s.syncedAt || 0, ...(s.walks || []).map((w) => (w.start || 0) + (w.elapsed || 0)));
      $('#synced').textContent = ult ? 'Datos del ' + new Date(ult).toLocaleString(PM.LOCALE, { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
      document.documentElement.style.setProperty('--paint', s.color || '#ff2e88');
    }

    // ---------------- mapa (MapLibre: mapa vectorial de OpenFreeMap, como en la app) ----------------
    const ll = (q) => [q[1], q[0]];
    const FC = (features) => ({ type: 'FeatureCollection', features });
    const lineF = (pts, props) => ({ type: 'Feature', properties: props || {}, geometry: { type: 'LineString', coordinates: pts.map(ll) } });
    let lmMarkers = [], mapLoaded = null, monumentosOff = false;
    // grupos de capas que se encienden/apagan con los botones de encima del mapa
    const GROUPS = { calles: ['pv-glow', 'pv-paint'], rutas: ['pv-walks'], monumentos: [], barrios: ['pv-barrios'] };
    function setData(id, fc) {
      if (map.getSource(id)) map.getSource(id).setData(fc);
      else map.addSource(id, { type: 'geojson', data: fc });
    }
    async function drawMap() {
      const { s, walks, lms } = A;
      const color = s.color || '#ff2e88';
      if (!map) {
        map = new maplibregl.Map({ container: 'bigmap', style: PM.mapStyle.URL.light, center: [2.07386, 41.35763], zoom: 14,
          attributionControl: false, dragRotate: false, pitchWithRotate: false, touchPitch: false, maxPitch: 0 });   // siempre en 2D desde arriba
        map.touchZoomRotate.disableRotation();
        map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-right');
        map.addControl(new maplibregl.AttributionControl({ compact: true, customAttribution: '© OpenStreetMap · OpenFreeMap' }), 'bottom-left');
        mapLoaded = new Promise((r) => map.on('load', r));
        map.on('style.load', () => PM.mapStyle.enhance(map, 'light'));
      }
      await mapLoaded;
      const bounds = new maplibregl.LngLatBounds();
      const ext = (pts) => pts.forEach((q) => bounds.extend(ll(q)));
      // calles pintadas
      const geo = Object.values(data.geo || {});
      setData('pv-painted', FC(geo.map((g) => lineF(g))));
      geo.forEach(ext);
      // recorridos (más recientes, más intensos)
      const wf = [];
      walks.forEach((w, i) => splitTrack(w.track).forEach((sg) => { wf.push(lineF(sg, { o: Math.max(0.15, 0.55 - i * 0.04) })); ext(sg); }));
      setData('pv-walks', FC(wf));
      // monumentos: solo el marcador, sin halo alrededor (toca para ver la carta)
      // barrios conquistados (silueta)
      const bf = [];
      Object.values(s.barrioCards || {}).forEach((bc) => (bc.lines || []).forEach((ln) => bf.push(lineF(ln))));
      setData('pv-barrios', FC(bf));
      // recorrido seleccionado
      setData('pv-sel', FC([]));
      const first = (map.getStyle().layers || []).find((l) => l.type === 'symbol');
      // (al «Actualizar», las capas ya están: se les pone el color de ahora; antes se quedaban con el de la primera vez)
      const add = (l) => { if (!map.getLayer(l.id)) map.addLayer(l, first && first.id); else if (l.paint && l.paint['line-color'] && typeof l.paint['line-color'] === 'string') map.setPaintProperty(l.id, 'line-color', l.paint['line-color']); };
      const round = { 'line-cap': 'round', 'line-join': 'round' };
      add({ id: 'pv-barrios', type: 'line', source: 'pv-barrios', paint: { 'line-color': '#8b5cf6', 'line-width': 3, 'line-opacity': 0.55 } });
      add({ id: 'pv-glow', type: 'line', source: 'pv-painted', layout: round, paint: { 'line-color': color, 'line-width': ['interpolate', ['linear'], ['zoom'], 12, 4, 17, 14], 'line-opacity': 0.18, 'line-blur': 4 } });
      add({ id: 'pv-paint', type: 'line', source: 'pv-painted', layout: round, paint: { 'line-color': color, 'line-width': ['interpolate', ['linear'], ['zoom'], 12, 1.5, 17, 4.5] } });
      add({ id: 'pv-walks', type: 'line', source: 'pv-walks', paint: { 'line-color': '#1a1d29', 'line-width': 2, 'line-opacity': ['get', 'o'], 'line-dasharray': [2, 3] } });
      add({ id: 'pv-sel-casing', type: 'line', source: 'pv-sel', layout: round, paint: { 'line-color': '#fff', 'line-width': 9, 'line-opacity': 0.9 } });
      add({ id: 'pv-sel', type: 'line', source: 'pv-sel', layout: round, paint: { 'line-color': '#1f5fbf', 'line-width': 5 } });
      lmMarkers.forEach((m) => m.remove()); lmMarkers = [];
      lms.filter((v) => v.pos).forEach((v) => {
        const el = document.createElement('div');
        el.innerHTML = `<div class="lmk" style="--c:${RAR_C[v.rarity]}" title="${esc(v.name)}">${esc(v.emoji)}</div>`;
        el.addEventListener('click', (e) => { e.stopPropagation(); openCard(v.id); });
        lmMarkers.push(new maplibregl.Marker({ element: el }).setLngLat(ll(v.pos)).addTo(map));
        bounds.extend(ll(v.pos));
      });
      const layers = { calles: { name: 'Calles pintadas', dot: color }, rutas: { name: 'Recorridos', dot: '#1a1d29' }, monumentos: { name: 'Monumentos', dot: '#ffb700' }, barrios: { name: 'Barrios 🚩', dot: '#8b5cf6' } };
      // (al «Actualizar», cada botón sale como estaba: antes volvían todos a encendidos aunque la capa siguiera oculta)
      const encendida = (k) => (k === 'monumentos' ? !monumentosOff : GROUPS[k].every((id) => !map.getLayer(id) || map.getLayoutProperty(id, 'visibility') !== 'none'));
      if (monumentosOff) lmMarkers.forEach((m) => (m.getElement().style.display = 'none'));
      $('#layers').innerHTML = Object.entries(layers).map(([k, l]) => `<button class="chip${encendida(k) ? ' on' : ''}" data-l="${k}"><i style="background:${l.dot}"></i>${l.name}</button>`).join('');
      document.querySelectorAll('[data-l]').forEach((el) => el.addEventListener('click', () => {
        const on = !el.classList.contains('on'); el.classList.toggle('on', on);
        GROUPS[el.dataset.l].forEach((id) => map.getLayer(id) && map.setLayoutProperty(id, 'visibility', on ? 'visible' : 'none'));
        if (el.dataset.l === 'monumentos') { monumentosOff = !on; lmMarkers.forEach((m) => (m.getElement().style.display = on ? '' : 'none')); }
      }));
      fitBounds = bounds.isEmpty() ? null : bounds;
      fit();
      setTimeout(() => map.resize(), 60);
    }
    // ---------------- carta coleccionable (estilo TCG) ----------------
    function cardData(id) {
      const s = A.s, v = s.landmarks[id], info = (s.cardInfo || {})[id] || {};
      const order = Object.keys(s.landmarks).sort((a, b) => s.landmarks[a].t - s.landmarks[b].t);
      return { id, shiny: !!v.shiny, must: !!v.must, name: v.name, kind: v.kind, emoji: v.emoji, rarity: v.rarity, city: v.city, barrio: v.barrio, t: v.t, visits: v.visits, wiki: v.wiki, wd: v.wd, pos: v.pos, color: s.color,
        img: info.img, text: info.text, credit: info.credit, points: 100 * ((RAR[v.rarity] || {}).mult || 1) * (v.must ? 2 : 1) * (v.shiny ? 2 : 1),
        number: order.indexOf(id) + 1, total: order.length, player: s.player || creds.user };
    }
    const photoCache = {};
    async function ownPhoto(id) {
      if (!(id in photoCache)) photoCache[id] = data.photo ? data.photo(id) : Promise.resolve(null);
      return photoCache[id];
    }
    async function openCard(id) {
      const v = A.s.landmarks[id];
      const d = cardData(id);
      if ((A.s.cardPhotos || {})[id]) { const img = await ownPhoto(id); if (img) { d.img = img; d.own = true; d.credit = 'Foto: ' + (A.s.player || creds.user); } }
      PM.tcg.open(d, { actions: [{ ico: 'mapa', label: 'Ver en el mapa', on: () => { PM.tcg.close(); if (v.pos) map.flyTo({ center: ll(v.pos), zoom: 18 }); } }] });
    }

    // ---------------- álbumes ----------------
    // El álbum se recorta con el contorno de la ciudad, y aquí no se ha paseado por ella: se pide una vez por ciudad y se
    // guarda. De una en una y con pausa: el servicio de OpenStreetMap solo admite una consulta por segundo
    let colaForma = Promise.resolve();
    function posDe(city) {
      const r = Object.values(A.s.landmarks || {}).find((x) => x.city === city && x.pos);
      if (r) return r.pos;
      const k = Object.keys(A.s.tileNames || {}).find((x) => A.s.tileNames[x].city === city);
      return k ? PM.world.tileBounds(k)[0] : null;
    }
    function albumWeb(city) {
      colaForma = colaForma.then(async () => {
        const p = posDe(city);
        if (PM.world.conForma(city) || !p) return;
        await PM.world.formaDe(p[0], p[1]);
        await new Promise((r) => setTimeout(r, 1100));
      }).catch(() => {});   // (si una ciudad no se puede pedir, las demás siguen: antes la cola quedaba rota y ya no se abría ningún álbum)
      return colaForma.then(() => PM.world.albumDe(city));
    }

    // Pantalla completa: el mismo álbum, en el sitio donde estabas, se pasa a una capa que ocupa toda la ventana (y, si el
    // navegador lo deja, toda la pantalla). Esc o ✕ lo devuelven
    function pantallaAlbum(on, soloCapa) {
      const ov = $('#alb-full'), box = $('#album-box');
      if (!box || on === ov.classList.contains('show')) return;
      ov.classList.toggle('show', on);
      ($(on ? '#af-body' : '#alb-home') || ov).appendChild(box);
      if (on && !soloCapa) { const f = document.documentElement.requestFullscreen; if (f) f.call(document.documentElement).catch(() => {}); }
      else if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    }
    $('#af-x').addEventListener('click', () => pantallaAlbum(false));
    document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) pantallaAlbum(false); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !document.querySelector('#tcg-view.show')) pantallaAlbum(false); });

    function fit() { if (fitBounds) map.fitBounds(fitBounds, { padding: 60, maxZoom: 17, duration: 0 }); else map.jumpTo({ center: [2.07386, 41.35763], zoom: 15 }); }
    $('#fit').addEventListener('click', () => { if (map.getSource('pv-sel')) map.getSource('pv-sel').setData(FC([])); document.querySelectorAll('.walk').forEach((x) => x.classList.remove('sel')); fit(); });
    function splitTrack(t) {
      const segs = []; let cur = [];
      (t || []).forEach((p) => { if (!p) { if (cur.length > 1) segs.push(cur); cur = []; } else cur.push(p); });
      if (cur.length > 1) segs.push(cur);
      return segs;
    }
    function showWalk(w, el) {
      document.querySelectorAll('.walk').forEach((x) => x.classList.remove('sel'));
      if (el) el.classList.add('sel');
      const segs = splitTrack(w.track);
      if (!segs.length || !map.getSource('pv-sel')) return;
      map.getSource('pv-sel').setData(FC(segs.map((sg) => lineF(sg))));
      const bb = new maplibregl.LngLatBounds(); segs.forEach((sg) => sg.forEach((q) => bb.extend(ll(q))));
      map.fitBounds(bb, { padding: 80, maxZoom: 18 });
    }

    // ---------------- gráficos (SVG) ----------------
    // anillo de progreso (0..1) con texto en medio
    function ring(p, size, sw, color, label) {
      const r = (size - sw) / 2, c = 2 * Math.PI * r, v = Math.max(0, Math.min(1, p || 0));
      return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="#eceef3" stroke-width="${sw}"/>
        <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="${v > 0.02 ? 'round' : 'butt'}" stroke-dasharray="${(c * v).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 ${size / 2} ${size / 2})"/>
        <text x="50%" y="50%" dominant-baseline="central" text-anchor="middle" fill="#1a1d29">${label}</text></svg>`;
    }
    // gráfico de área doble: andado (gris) y calles nuevas (tu color)
    function area(bk) {
      const W = 400, H = 140, pl = 4, pb = 18, n = bk.length, max = Math.max(0.1, ...bk.map((b) => Math.max(b.w, b.p)));
      const X = (i) => pl + (n === 1 ? (W - pl * 2) / 2 : i * (W - pl * 2) / (n - 1)), Y = (v) => H - pb - v / max * (H - pb - 8);
      const path = (k) => bk.map((b, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ',' + Y(b[k]).toFixed(1)).join('');
      const fill = (k) => path(k) + `L${X(n - 1).toFixed(1)},${H - pb}L${X(0).toFixed(1)},${H - pb}Z`;
      const every = Math.max(1, Math.ceil(n / 6));
      let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block"><defs>
        <linearGradient id="gw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9aa3b5" stop-opacity=".45"/><stop offset="1" stop-color="#9aa3b5" stop-opacity="0"/></linearGradient>
        <linearGradient id="gp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--paint)" stop-opacity=".45"/><stop offset="1" stop-color="var(--paint)" stop-opacity="0"/></linearGradient></defs>`;
      for (let g = 1; g <= 3; g++) svg += `<line x1="0" x2="${W}" y1="${Y(max * g / 3).toFixed(1)}" y2="${Y(max * g / 3).toFixed(1)}" stroke="#eceef3"/>`;
      svg += `<path d="${fill('w')}" fill="url(#gw)"/><path d="${path('w')}" fill="none" stroke="#9aa3b5" stroke-width="2"/>`;
      svg += `<path d="${fill('p')}" fill="url(#gp)"/><path d="${path('p')}" fill="none" stroke="var(--paint)" stroke-width="2.4"/>`;
      bk.forEach((b, i) => { svg += `<circle cx="${X(i).toFixed(1)}" cy="${Y(b.p).toFixed(1)}" r="${b.p ? 2.6 : 0}" fill="var(--paint)"><title>${b.lab}: ${b.w.toFixed(2)} km andados · ${b.p.toFixed(2)} km nuevos</title></circle>`;
        if (i % every === 0 || i === n - 1) svg += `<text x="${X(i).toFixed(1)}" y="${H - 4}" font-size="10" fill="#8a91a0" text-anchor="middle">${b.lab}</text>`; });
      svg += `<text x="${W - 2}" y="${Y(max) - 2}" font-size="10" fill="#8a91a0" text-anchor="end">${max.toFixed(1)} km</text>`;
      return svg + '</svg>';
    }
    // reloj de 24 h (barras radiales)
    function clock24(hours) {
      const max = Math.max(1e-6, ...hours), cx = 90, cy = 90, r0 = 34, r1 = 82;
      let svg = `<svg viewBox="0 0 180 180" width="100%" style="display:block;max-width:200px;margin:auto"><circle cx="${cx}" cy="${cy}" r="${r0 - 4}" fill="#f3f4f7"/>`;
      hours.forEach((v, hh) => {
        const a0 = (hh / 24) * 2 * Math.PI - Math.PI / 2 + 0.02, a1 = ((hh + 1) / 24) * 2 * Math.PI - Math.PI / 2 - 0.02, r = r0 + (r1 - r0) * (v / max);
        const P = (a, rr) => (cx + rr * Math.cos(a)).toFixed(1) + ',' + (cy + rr * Math.sin(a)).toFixed(1);
        svg += `<path d="M${P(a0, r0)}L${P(a0, Math.max(r0 + 2, r))}A${r},${r} 0 0 1 ${P(a1, Math.max(r0 + 2, r))}L${P(a1, r0)}A${r0},${r0} 0 0 0 ${P(a0, r0)}Z" fill="${v ? 'var(--accent)' : '#eceef3'}" fill-opacity="${v ? (0.3 + 0.7 * v / max).toFixed(2) : 1}"><title>${hh}:00 · ${v.toFixed(2)} km</title></path>`;
      });
      [[0, '0h'], [6, '6h'], [12, '12h'], [18, '18h']].forEach(([hh, l]) => { const a = hh / 24 * 2 * Math.PI - Math.PI / 2; svg += `<text x="${(cx + (r0 - 14) * Math.cos(a)).toFixed(1)}" y="${(cy + (r0 - 14) * Math.sin(a) + 3).toFixed(1)}" font-size="8" fill="#8a91a0" text-anchor="middle">${l}</text>`; });
      return svg + '</svg>';
    }
    // barras horizontales con valor
    function hbars(labels, vals, hi) {
      const max = Math.max(1e-6, ...vals);
      return '<div class="hbars">' + labels.map((l, i) => `<div class="${i === hi ? 'hi' : ''}"><span>${l}</span><i><em style="width:${(vals[i] / max * 100).toFixed(1)}%"></em></i><b>${vals[i].toFixed(1)} km</b></div>`).join('') + '</div>';
    }

    // ---------------- piezas comunes (antes, copiadas dos y tres veces) ----------------
    const plural = (n, uno, varios) => PM.fmtNum(n) + ' ' + (n === 1 ? uno : varios);
    const dia = (t) => new Date(t).toLocaleDateString(PM.LOCALE, { day: 'numeric', month: 'short' });
    const delta = (a, b) => { if (!b) return ''; const d = (a - b) / b * 100; return `<span class="dl ${d >= 0 ? 'up' : 'down'}">${d >= 0 ? '▲' : '▼'} ${Math.abs(d).toFixed(0)} %</span>`; };
    const kpi = (v, l, d) => `<div class="kpi"><b>${v}</b><small>${l}</small>${d ? `<div>${d}</div>` : ''}</div>`;
    const rec = (ic, l, v, w, fecha) => `<div class="rec" ${w ? `data-wi="${A.walks.indexOf(w)}"` : ''}><span>${ic}</span><div><small>${l}</small><b>${v}</b></div><em>${w ? dia(w.start) : fecha || ''}</em></div>`;
    const sum = (ws, f) => ws.reduce((a, w) => a + (f(w) || 0), 0);
    // tu foto de cromo (de la nube), en la carta en cuanto llega
    async function pegarFoto(el, id) {
      if (!(A.s.cardPhotos || {})[id]) return;
      // (.ab-ph: el cromo del álbum —rediseño—; .tcg-photo: la carta grande)
      const img = await ownPhoto(id);
      if (!img || !el.isConnected) return;
      const ph = el.querySelector('.ab-ph, .tcg-photo');
      if (!ph) return;
      el.dataset.own = '1';
      ph.style.backgroundImage = `url('${String(img).replace(/'/g, '%27')}')`;
      ph.innerHTML = '';
      ph.classList.add('con');
    }
    const rangoCiudad = (c) => PM.RANKS[Math.max(0, PM.rankFor('city', c.pct))];

    // ---------------- panel: Resumen · Paseos · Colección ----------------
    document.querySelectorAll('#tabs button').forEach((b) => b.addEventListener('click', () => {
      tab = b.dataset.t; document.querySelectorAll('#tabs button').forEach((x) => x.classList.toggle('on', x === b)); drawPanel();
    }));

    // RESUMEN: lo esencial, cada dato una sola vez (el nivel va arriba, junto a tu nombre)
    function panelResumen() {
      const { s, st, walks, days, cities, lms } = A, DAY = 86400000;
      const nB = Object.keys(s.conqueredB || {}).length, nC = Object.keys(s.citiesWon || {}).length;
      let h = `<div class="totales">
        <div class="pintado"><b>${km(st.paintedM || 0)}</b><small>km pintados</small></div>
        <div><b>${PM.fmtNum(lms.length)}</b><small>${lms.length === 1 ? 'lugar' : 'lugares'}</small></div>
        <div><b>${nB}</b><small>${nB === 1 ? 'barrio' : 'barrios'} 🚩</small></div>
        <div><b>${nC}</b><small>${nC === 1 ? 'ciudad' : 'ciudades'} 👑</small></div></div>`;
      if (walks.length) h += `<p class="desde">Desde el ${new Date(walks[walks.length - 1].start).toLocaleDateString(PM.LOCALE, { day: 'numeric', month: 'long', year: 'numeric' })} · ${plural(walks.length, 'paseo', 'paseos')} · ${plural(Object.keys(days).length, 'día', 'días')} en la calle · ${km(st.walkedM || 0)} km andados</p>`;

      // esta semana (de lunes a hoy) frente a la anterior
      const hoy0 = new Date(); hoy0.setHours(0, 0, 0, 0);
      const lunes = new Date(hoy0); lunes.setDate(lunes.getDate() - ((lunes.getDay() + 6) % 7));
      const lunesAnt = new Date(lunes); lunesAnt.setDate(lunesAnt.getDate() - 7);
      const semana = (a, b) => { const ws = walks.filter((w) => w.start >= a && w.start < b); return { n: ws.length, walked: sum(ws, (w) => w.st.walked), painted: sum(ws, (w) => w.st.painted), ms: sum(ws, mov) }; };
      const W0 = semana(lunes.getTime(), Infinity), W1 = semana(lunesAnt.getTime(), lunes.getTime());
      const wd = ['L', 'M', 'X', 'J', 'V', 'S', 'D'].map((l, i) => { const t = new Date(lunes); t.setDate(t.getDate() + i); const d = days[dayKey(t)]; return { l, w: d ? d.walked / 1000 : 0, p: d ? d.painted / 1000 : 0, today: t.getTime() === hoy0.getTime(), fut: t > hoy0 }; });
      const wmax = Math.max(0.5, ...wd.map((x) => x.w));
      h += `<div class="card"><h3>Esta semana <span>frente a la anterior</span></h3>
        <div class="wk3"><div><b>${dist(W0.walked)}</b><small>andados</small>${delta(W0.walked, W1.walked)}</div>
          <div><b>${dist(W0.painted)}</b><small>calles nuevas</small>${delta(W0.painted, W1.painted)}</div>
          <div><b>${dur(W0.ms)}</b><small>${plural(W0.n, 'paseo', 'paseos')}</small>${delta(W0.ms, W1.ms)}</div></div>
        <div class="wkbars">${wd.map((x) => `<div class="${x.today ? 'today' : ''} ${x.fut ? 'fut' : ''}" title="${x.w.toFixed(2)} km andados · ${x.p.toFixed(2)} km nuevos">
          <span><i style="height:${(x.w / wmax * 100).toFixed(0)}%"></i><em style="height:${(Math.min(x.p, x.w || x.p) / wmax * 100).toFixed(0)}%"></em></span><small>${x.l}</small></div>`).join('')}</div>
        <div class="legend"><span><i style="background:#cfd5e0"></i>andado</span><span><i style="background:var(--paint)"></i>calles nuevas</span></div></div>`;

      // territorio: ciudades en anillos y, para la siguiente por conquistar, cuánto falta a tu ritmo
      const top = cities.slice(0, 3), sig = cities.find((c) => c.tot && !c.won);
      h += `<div class="card"><h3>Tu territorio <span>conquista al 70 % · 🥈 80 · 🥇 90</span></h3>${top.length ? `<div class="terr">${top.map((c) => `<div>
          ${ring(c.tot ? Math.min(1, c.pct / PM.CONQ.city) : 0, 86, 8, c.won ? rangoCiudad(c).color : 'var(--paint)', `<tspan font-size="14" font-weight="800">${c.tot ? (c.pct * 100).toFixed(c.pct < 0.1 ? 1 : 0) + '%' : '?'}</tspan>`)}
          <b>${c.won ? rangoCiudad(c).ic + ' ' : ''}${esc(c.c)}</b><small>${dist(c.m)}${c.tot ? ' de ' + dist(c.tot) : ''}</small></div>`).join('')}</div>` : '<div class="empty">Aún sin ciudades.</div>'}
        ${cities.length > 3 ? `<div class="more">${cities.slice(3).map((c) => `<span>${c.won ? rangoCiudad(c).ic + ' ' : ''}${esc(c.c)} · ${c.tot ? (c.pct * 100).toFixed(2) + ' %' : dist(c.m)}</span>`).join('')}</div>` : ''}
        ${sig ? (() => { const falta = Math.max(0, sig.tot * PM.CONQ.city - sig.m); return `<p class="proy">🎯 Para conquistar <b>${esc(sig.c)}</b> te faltan <b>${dist(falta)}</b>${A.perDay > 0 ? `: a tu ritmo de los últimos 30 días (${dist(A.perDay)} al día), unos <b>${plural(Math.ceil(falta / A.perDay), 'día', 'días')}</b>` : ''}.</p>`; })() : ''}</div>`;

      // próximos objetivos: los logros más a punto (el siguiente nivel ya se ve arriba)
      const ach = PM.game.ACHIEVEMENTS, gotA = s.achievements || {};
      const next = Object.entries(ach).filter(([id, a]) => !gotA[id] && a.prog).map(([id, a]) => ({ a, p: a.prog(s) })).filter((x) => x.p > 0 && x.p < 1)
        .sort((x, y) => y.p - x.p).filter((x, i, arr) => arr.findIndex((z) => z.a.icon === x.a.icon && z.a.name.split(' ')[0] === x.a.name.split(' ')[0]) === i).slice(0, 4);
      if (next.length) h += `<div class="card"><h3>Próximos objetivos</h3>${next.map((x) => `<div class="goal"><span>${x.a.icon}</span><div><b>${esc(x.a.name)}</b><small>${esc(x.a.desc)}</small><div class="pbar"><i style="width:${(x.p * 100).toFixed(1)}%"></i></div></div><em>${Math.floor(x.p * 100)} %</em></div>`).join('')}</div>`;

      // récords: un solo juego de récords (antes había dos distintos, en Resumen y en Actividad)
      const R = A.recs;
      h += `<div class="card"><h3>Récords <span>toca uno para verlo en el mapa</span></h3><div class="recs">
        ${R.largo ? rec('🥾', 'Paseo más largo', dist(R.largo.st.walked), R.largo) : ''}
        ${R.nuevas ? rec('🖌️', 'Más calles nuevas', dist(R.nuevas.st.painted), R.nuevas) : ''}
        ${R.rapido ? rec('⚡', 'Ritmo más rápido', pace(mov(R.rapido), R.rapido.st.walked), R.rapido) : ''}
        ${A.bestDay && !(R.nuevas && dayKey(R.nuevas.start) === A.bestDay[0] && Math.abs(R.nuevas.st.painted - A.bestDay[1].painted) < 1) ? rec('📅', 'Mejor día', dist(A.bestDay[1].painted) + ' nuevos', null, dia(A.bestDay[0] + 'T12:00')) : ''}
        ${rec('🔥', 'Racha más larga', plural(A.maxStreak, 'día', 'días'), null, (st.streak || 0) > 1 ? 'ahora ' + st.streak : '')}
        ${rec('✖️', 'Mejor combo', 'x' + (st.bestCombo || 0))}</div></div>`;
      return h;
    }

    // PASEOS: el periodo que elijas (con el anterior para comparar), el calendario con los paseos de cada día y tus costumbres
    function panelPaseos() {
      const { walks, days } = A, DAY = 86400000, hoy0 = new Date(); hoy0.setHours(0, 0, 0, 0);
      const PER = { d7: { n: 7, unit: 'd', name: '7 días' }, d30: { n: 30, unit: 'd', name: '30 días' }, w12: { n: 12, unit: 'w', name: '12 semanas' }, all: { n: 0, unit: 'm', name: 'Todo' } };
      const per = PER[actPeriod] || PER.d30;
      const firstWalk = walks.length ? walks[walks.length - 1].start : Date.now();
      const spanMs = per.unit === 'd' ? per.n * DAY : per.unit === 'w' ? per.n * 7 * DAY : Math.max(DAY, Date.now() - firstWalk + DAY);
      const from = Date.now() - spanMs, prevFrom = from - spanMs;
      const agg = (ws) => ({ walked: sum(ws, (w) => w.st.walked), painted: sum(ws, (w) => w.st.painted), ms: sum(ws, mov), n: ws.length, days: new Set(ws.map((w) => dayKey(w.start))).size });
      const cur = agg(walks.filter((w) => w.start >= from)), prv = agg(walks.filter((w) => w.start >= prevFrom && w.start < from));
      const d = (a, b) => (actPeriod === 'all' ? '' : delta(a, b));
      let h = `<div class="seg">${Object.entries(PER).map(([k, v]) => `<button class="${k === actPeriod ? 'on' : ''}" data-per="${k}">${v.name}</button>`).join('')}</div>`;
      h += `<div class="kpis">${kpi(dist(cur.walked), 'andados', d(cur.walked, prv.walked))}${kpi(dist(cur.painted), 'calles nuevas', d(cur.painted, prv.painted))}${kpi(dur(cur.ms), 'en movimiento', d(cur.ms, prv.ms))}
        ${kpi(cur.n, cur.n === 1 ? 'paseo' : 'paseos', d(cur.n, prv.n))}${kpi(cur.days, cur.days === 1 ? 'día activo' : 'días activos', d(cur.days, prv.days))}${kpi(pace(cur.ms, cur.walked), 'ritmo medio')}</div>`;
      // andado y pintado por día / semana / mes
      const buckets = [];
      if (per.unit === 'd') for (let i = per.n - 1; i >= 0; i--) { const t0 = new Date(hoy0); t0.setDate(t0.getDate() - i); const t1 = new Date(t0); t1.setDate(t1.getDate() + 1); buckets.push({ t0: t0.getTime(), t1: t1.getTime(), lab: t0.getDate() + '/' + (t0.getMonth() + 1) }); }
      else if (per.unit === 'w') for (let i = per.n - 1; i >= 0; i--) { const t0 = new Date(hoy0); t0.setDate(t0.getDate() - ((t0.getDay() + 6) % 7) - 7 * i); const t1 = new Date(t0); t1.setDate(t1.getDate() + 7); buckets.push({ t0: t0.getTime(), t1: t1.getTime(), lab: t0.getDate() + '/' + (t0.getMonth() + 1) }); }
      else { const d0 = new Date(firstWalk); for (let y = d0.getFullYear(), m = d0.getMonth(); new Date(y, m, 1) <= new Date(); m++) buckets.push({ t0: new Date(y, m, 1).getTime(), t1: new Date(y, m + 1, 1).getTime(), lab: new Date(y, m, 1).toLocaleDateString(PM.LOCALE, { month: 'short' }) }); }
      buckets.forEach((bk) => { const ws = walks.filter((w) => w.start >= bk.t0 && w.start < bk.t1); bk.w = sum(ws, (w) => w.st.walked) / 1000; bk.p = sum(ws, (w) => w.st.painted) / 1000; });
      h += `<div class="card"><h3>Andado y pintado <span>km por ${per.unit === 'd' ? 'día' : per.unit === 'w' ? 'semana' : 'mes'}</span></h3>${area(buckets)}
        <div class="legend"><span><i style="background:#9aa3b5"></i>andado</span><span><i style="background:var(--paint)"></i>calles nuevas</span></div></div>`;
      // calendario del mes (más intenso cuanto más pintaste) y, al tocar un día, sus paseos
      const byDay = {}; walks.forEach((w, i) => (byDay[dayKey(w.start)] = byDay[dayKey(w.start)] || []).push(i));
      if (!calMonth) { const last = walks.length ? new Date(walks[0].start) : new Date(); calMonth = new Date(last.getFullYear(), last.getMonth(), 1); calDay = walks.length ? dayKey(last) : null; }
      const y = calMonth.getFullYear(), mo = calMonth.getMonth(), first = (new Date(y, mo, 1).getDay() + 6) % 7, nd = new Date(y, mo + 1, 0).getDate();
      const kmDay = (k) => sum(byDay[k] || [], (i) => walks[i].st.painted);
      const maxKm = Math.max(1, ...Object.keys(byDay).map(kmDay));
      let cells = '';
      for (let i = 0; i < first; i++) cells += '<span></span>';
      for (let dd = 1; dd <= nd; dd++) {
        const k = y + '-' + String(mo + 1).padStart(2, '0') + '-' + String(dd).padStart(2, '0'), n = (byDay[k] || []).length;
        cells += `<button class="cd ${n ? 'on' : ''} ${k === calDay ? 'sel' : ''} ${k === dayKey(Date.now()) ? 'today' : ''}" data-day="${k}" ${n ? `style="--a:${(0.25 + 0.75 * Math.min(1, kmDay(k) / maxKm)).toFixed(2)}"` : 'disabled'}>${dd}${n > 1 ? `<i>${n}</i>` : ''}</button>`;
      }
      const inMonth = walks.filter((w) => new Date(w.start).getFullYear() === y && new Date(w.start).getMonth() === mo);
      const dayList = calDay && byDay[calDay] ? byDay[calDay] : [];
      h += `<div class="card"><div class="calhead"><button class="calnav" data-m="-1" aria-label="Mes anterior">‹</button><b>${calMonth.toLocaleDateString(PM.LOCALE, { month: 'long', year: 'numeric' })}</b><button class="calnav" data-m="1" aria-label="Mes siguiente">›</button></div>
        <div class="calgrid"><small>L</small><small>M</small><small>X</small><small>J</small><small>V</small><small>S</small><small>D</small>${cells}</div>
        <p class="calsum">${inMonth.length ? `${plural(new Set(inMonth.map((w) => dayKey(w.start))).size, 'día', 'días')} · ${plural(inMonth.length, 'paseo', 'paseos')} · ${dist(sum(inMonth, (w) => w.st.walked))} andados · ${dist(sum(inMonth, (w) => w.st.painted))} nuevos` : 'Sin paseos este mes'}</p>
        ${dayList.length ? dayList.map((i) => { const w = walks[i]; return `
          <div class="walk" data-i="${i}"><b>${new Date(w.start).toLocaleDateString(PM.LOCALE, { weekday: 'long', day: 'numeric', month: 'short' })} · ${new Date(w.start).toLocaleTimeString(PM.LOCALE, { hour: '2-digit', minute: '2-digit' })}</b>
          <div class="pts">+${PM.fmtNum(w.st.pts || 0)}</div>
          <small>⏱ ${dur(mov(w))}${mov(w) < w.elapsed - 60000 ? ' (total ' + dur(w.elapsed) + ')' : ''} · 🚶 ${dist(w.st.walked)} · 🖌️ ${dist(w.st.painted)} nuevos · ⚡ ${pace(mov(w), w.st.walked)}${w.st.captures ? ' · 📸 ' + w.st.captures : ''}${w.st.conquests ? ' · 🚩 ' + w.st.conquests : ''}${w.imported ? ' · ⌚' : ''}</small>
          <button class="wdet" data-w="${i}">📊 Estadísticas, vídeo y exportar</button></div>`; }).join('') : ''}</div>`;
      // tus costumbres: a qué hora y qué días sales
      if (walks.length) {
        const WD = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];
        const peakH = A.hours.indexOf(Math.max(...A.hours)), peakD = A.wdays.indexOf(Math.max(...A.wdays));
        h += `<div class="grid2"><div class="card"><h3>¿A qué hora sales? <span>sobre las ${peakH}:00</span></h3>${clock24(A.hours)}</div>
          <div class="card"><h3>Qué días <span>sobre todo el ${WD[peakD].toLowerCase()}</span></h3>${hbars(WD.map((x) => x.slice(0, 3)), A.wdays, peakD)}</div></div>`;
      }
      return h;
    }

    // COLECCIÓN: tus cartas (en el álbum, como en la app), los barrios y los logros
    function panelColeccion() {
      const { s, lms } = A;
      const byR = ['legendario', 'epico', 'raro', 'comun'].map((r) => ({ r, v: lms.filter((l) => l.rarity === r).length, c: RAR_C[r] }));
      const ach = PM.game.ACHIEVEMENTS, got = s.achievements || {}, nA = Object.keys(ach).length, gA = Object.keys(got).filter((k) => ach[k]).length;
      const bc = Object.entries(s.barrioCards || {}).map(([id, v]) => Object.assign({ id }, v)).sort((a, b) => b.t - a.t);
      let h = `<div class="card"><div class="coltop"><div><b>${PM.fmtNum(lms.length)}</b><small>cartas</small></div><div><b>${Object.keys(s.cardPhotos || {}).length}</b><small>con tu foto</small></div><div><b>${gA} / ${nA}</b><small>logros</small></div></div>
        ${lms.length ? `<div class="stackbar">${byR.filter((x) => x.v).map((x) => `<i style="flex:${x.v};background:${x.c}" title="${RAR[x.r].label}: ${x.v}"></i>`).join('')}</div>
        <div class="legend">${byR.map((x) => `<span><i style="background:${x.c}"></i>${RAR[x.r].label} ${x.v}</span>`).join('')}</div>` : ''}</div>`;
      h += `<div class="card"><h3>Mis álbumes <button class="hbtn" id="alb-fs">⛶ Pantalla completa</button></h3><div id="alb-home"><div id="album-box"></div></div></div>`;
      h += `<div class="card"><h3>Barrios conquistados <span>${bc.length}</span></h3>${bc.length ? bc.map((b) => { const rk = (s.barrioRank || {})[b.id] != null ? s.barrioRank[b.id] : ((s.perfectB || {})[b.id] ? 2 : 0); return `<div class="row"><span>${PM.RANKS[rk].ic} ${esc(b.name)} <small class="muted">· ${PM.RANKS[rk].name}</small></span><b>${new Date(b.t).toLocaleDateString(PM.LOCALE)}</b></div>`; }).join('') : '<div class="empty">Pinta el 60 % de un barrio para conquistarlo (80 % plata, 90 % oro).</div>'}</div>`;
      h += `<details class="card logros"><summary><h3>Logros <span>${gA} de ${nA} · ver todos</span></h3></summary><div class="ach">${Object.entries(ach).map(([id, a]) => `<div class="${got[id] ? '' : 'off'}" title="${esc(a.desc)}"><span>${a.icon}</span>${esc(a.name)}</div>`).join('')}</div></details>`;
      return h;
    }

    function drawPanel() {
      if ($('#alb-full').classList.contains('show')) pantallaAlbum(false);
      const P = $('#panel'), { walks } = A;
      P.innerHTML = tab === 'pas' ? panelPaseos() : tab === 'col' ? panelColeccion() : panelResumen();
      if (tab === 'col') {
        PM.fillLandmarkCities(A.s);
        PM.world.usarCiudades(A.s.ciudadId || (A.s.ciudadId = {}));   // (las ciudades con el mismo nombre se distinguen como en el móvil)
        PM.album.usar({ save: () => A.s, albumDe: albumWeb });
        $('#alb-fs').addEventListener('click', () => pantallaAlbum(true));
        const irA = (e) => { if (!e || !Array.isArray(e.pos) || e.pos.length < 2) return; pantallaAlbum(false); $('#bigmap').scrollIntoView({ behavior: 'smooth', block: 'nearest' }); map.flyTo({ center: ll(e.pos), zoom: 17 }); };
        PM.album.montar($('#album-box'), { datos: cardData, abrir: openCard, irA, pegada: pegarFoto });
      }
      P.querySelectorAll('.walk').forEach((el) => el.addEventListener('click', () => showWalk(walks[+el.dataset.i], el)));
      P.querySelectorAll('[data-per]').forEach((b) => b.addEventListener('click', () => { actPeriod = b.dataset.per; drawPanel(); }));
      P.querySelectorAll('.rec[data-wi]').forEach((r) => r.addEventListener('click', () => showWalk(walks[+r.dataset.wi])));
      P.querySelectorAll('.calnav').forEach((b) => b.addEventListener('click', () => { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + +b.dataset.m, 1); drawPanel(); }));
      P.querySelectorAll('.cd.on').forEach((b) => b.addEventListener('click', () => {
        calDay = b.dataset.day; drawPanel();
        const ws = walks.filter((w) => dayKey(w.start) === calDay);   // y en el mapa, los recorridos de ese día
        if (ws.length === 1) showWalk(ws[0]);
      }));
      P.querySelectorAll('.wdet').forEach((b) => b.addEventListener('click', (e) => { e.stopPropagation(); PM.replay.open(walks[+b.dataset.w], { geo: data.geo, color: A.s.color, player: A.s.player || creds.user }); }));
    }
  })();
  </script>

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi progreso · PintaMapa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="lib/maplibre/maplibre-gl.css">
  <style>
    :root {
      --bg: #f5f6fa; --card: #ffffff; --line: #eceef3; --text: #111827; --muted: #6b7280; --soft: #9ca3af;
      --paint: #ff2e88; --cyan: #06b6d4; --violet: #8b5cf6; --amber: #f59e0b; --green: #10b981;
      --r: 16px; --shadow: 0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
    button { font: inherit; cursor: pointer; }
    .muted { color: var(--muted); }
    /* ----- login ----- */
    #login { min-height: 100%; display: grid; place-items: center; padding: 24px; }
    .login-card { width: min(400px, 100%); background: var(--card); border-radius: 22px; padding: 32px 28px; box-shadow: 0 10px 40px rgba(16,24,40,.08); text-align: center; }
    .logo { font-weight: 900; font-style: italic; letter-spacing: -1px; font-size: 30px; }
    .logo .p { color: var(--paint); } .logo .m { color: var(--cyan); }
    .login-card h1 { font-size: 20px; margin: 18px 0 6px; } .login-card p { font-size: 14px; line-height: 1.5; margin: 0 0 18px; }
    .login-card input { width: 100%; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--line); background: #fafbfc; font: inherit; margin-bottom: 10px; outline: none; }
    .login-card input:focus { border-color: var(--paint); background: #fff; }
    .btn-main { width: 100%; padding: 13px; border: 0; border-radius: 12px; background: var(--paint); color: #fff; font-weight: 700; font-size: 15px; }
    .err { color: #dc2626; font-size: 13px; min-height: 18px; margin-top: 10px; }
    .howto { text-align: left; background: #f8f9fc; border-radius: 12px; padding: 12px 14px; font-size: 13px; line-height: 1.55; margin-top: 12px; }
    .howto ol { padding-left: 18px; margin: 6px 0; }
    /* ----- app ----- */
    #app { display: none; height: 100vh; grid-template-columns: minmax(0, 1fr) 460px; grid-template-rows: 64px minmax(0, 1fr); }
    #app.show { display: grid; }
    header { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; padding: 0 20px; background: var(--card); border-bottom: 1px solid var(--line); }
    .who { display: flex; align-items: center; gap: 12px; margin-left: 8px; }
    .ring { --p: 0; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 15px;
      background: conic-gradient(var(--paint) calc(var(--p) * 1%), #f0f1f5 0); position: relative; }
    .ring::before { content: ''; position: absolute; inset: 4px; border-radius: 50%; background: #fff; }
    .ring b { position: relative; }
    .who-txt b { display: block; font-size: 15px; } .who-txt small { color: var(--muted); font-size: 12px; }
    .grow { flex: 1; }
    .hbtn { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 12px; font-size: 13px; font-weight: 600; color: var(--text); text-decoration: none; }
    .hbtn:hover { border-color: #d6d9e0; }
    /* mapa */
    .mapwrap { position: relative; min-height: 0; }
    #bigmap { position: absolute; inset: 0; background: #e9ebf0; }
    .gray-tiles { filter: grayscale(1) contrast(.92) brightness(1.06); }
    .layers { position: absolute; z-index: 500; top: 14px; left: 14px; display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100% - 28px); }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,.95); backdrop-filter: blur(6px); border-radius: 99px; padding: 7px 12px; font-size: 12.5px; font-weight: 600; color: var(--muted); box-shadow: var(--shadow); }
    .chip.on { color: var(--text); border-color: var(--text); }
    .chip i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
    .mapstats { position: absolute; z-index: 500; left: 14px; bottom: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
    .mapstat { background: rgba(255,255,255,.95); backdrop-filter: blur(6px); border-radius: 12px; padding: 8px 12px; box-shadow: var(--shadow); }
    .mapstat b { display: block; font-size: 16px; } .mapstat small { color: var(--muted); font-size: 11px; }
    .fitbtn { position: absolute; z-index: 500; right: 14px; top: 14px; }
    .lmk { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 17px; background: #fff; border: 3px solid var(--c, #9aa4b2); box-shadow: 0 2px 6px rgba(0,0,0,.2); }
    .leaflet-popup-content-wrapper { border-radius: 14px; } .leaflet-popup-content { margin: 10px 12px; font-family: Inter, sans-serif; }
    .pop img { width: 220px; height: 130px; object-fit: cover; border-radius: 10px; display: block; margin-bottom: 8px; }
    .pop b { font-size: 14px; } .pop small { color: var(--muted); display: block; margin-top: 2px; }
    /* panel */
    aside { overflow-y: auto; border-left: 1px solid var(--line); background: var(--bg); padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .tabs { display: flex; gap: 4px; background: #eceef3; padding: 4px; border-radius: 12px; position: sticky; top: -16px; z-index: 5; }
    .tabs button { flex: 1; border: 0; background: transparent; padding: 8px 6px; border-radius: 9px; font-size: 13px; font-weight: 600; color: var(--muted); }
    .tabs button.on { background: #fff; color: var(--text); box-shadow: var(--shadow); }
    .card { background: var(--card); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); }
    .card h3 { margin: 0 0 12px; font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; display: flex; justify-content: space-between; align-items: baseline; }
    .card h3 span { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--soft); }
    .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .kpi { background: var(--card); border-radius: 14px; padding: 12px; box-shadow: var(--shadow); }
    .kpi b { display: block; font-size: 20px; font-weight: 800; letter-spacing: -.3px; font-variant-numeric: tabular-nums; }
    .kpi small { color: var(--muted); font-size: 11.5px; }
    .kpi em { font-style: normal; font-size: 11px; font-weight: 600; color: var(--green); }
    .kpi.hl b { color: var(--paint); }
    .row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
    .row:last-child { border-bottom: 0; } .row span { color: var(--muted); } .row b { font-variant-numeric: tabular-nums; }
    .pbar { height: 8px; border-radius: 99px; background: #f0f1f5; overflow: hidden; position: relative; margin: 6px 0 4px; }
    .pbar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--paint), #ff6fb0); }
    .pbar em { position: absolute; left: 80%; top: -2px; bottom: -2px; width: 2px; background: var(--text); opacity: .5; }
    .insight { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; line-height: 1.45; }
    .insight:last-child { border-bottom: 0; } .insight .ic { font-size: 18px; width: 26px; text-align: center; flex: none; }
    .walk { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 11px 12px; border-radius: 12px; cursor: pointer; border: 1px solid transparent; }
    .walk:hover { background: #f8f9fc; } .walk.sel { border-color: var(--paint); background: #fff5fa; }
    .walk b { font-size: 13.5px; } .walk .pts { color: var(--paint); font-weight: 700; font-size: 13px; text-align: right; }
    .walk small { color: var(--muted); font-size: 12px; grid-column: 1 / -1; }
    .cal { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 11px); gap: 3px; overflow-x: auto; padding-bottom: 4px; }
    .cal i { width: 11px; height: 11px; border-radius: 3px; background: #eef0f4; }
    .legend { display: flex; gap: 12px; font-size: 11.5px; color: var(--muted); margin-top: 8px; }
    .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .ach { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; }
    .ach div { text-align: center; font-size: 10.5px; color: var(--muted); }
    .ach div span { display: grid; place-items: center; width: 44px; height: 44px; margin: 0 auto 4px; border-radius: 12px; background: #f3f4f7; font-size: 22px; }
    .ach div.off span { filter: grayscale(1); opacity: .35; }
    .tcggrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .city-h { margin: 14px 0 8px; font-size: 14px; font-weight: 700; } .city-h span { color: var(--muted, #888); font-weight: 500; margin-left: 4px; }
    .wdet { margin-top: 8px; border: 1px solid rgba(127,127,127,.35); background: transparent; color: inherit; border-radius: 9px; padding: 7px 12px; font: 600 13px system-ui, sans-serif; cursor: pointer; }
    .tcggrid .tcg-cell { --w: 128px; } .tcggrid .tcg.mini { font-size: calc(var(--w) / 26); }
    .lmlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
    .lmc { border-radius: 12px; overflow: hidden; background: #f3f4f7; cursor: pointer; border: 2px solid var(--c, #e5e7eb); }
    .lmc .ph { height: 80px; background: #e9ebf0 center / cover; display: grid; place-items: center; font-size: 30px; }
    .lmc div.t { padding: 6px 8px; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: #fff; }
    svg text { font-family: Inter, sans-serif; }
    .empty { color: var(--muted); font-size: 13.5px; text-align: center; padding: 18px 8px; }
    @media (max-width: 980px) {
      #app { grid-template-columns: 1fr; grid-template-rows: 64px 55vh auto; height: auto; }
      aside { border-left: 0; overflow: visible; }
      .who-txt small { display: none; }
    }
  </style>
</head>
<body>
  <div id="login">
    <div class="login-card">
      <div class="logo"><span class="p">Pinta</span><span class="m">Mapa</span></div>
      <h1>Mi progreso</h1>
      <p class="muted">Todo lo que pintas por la calle, cifrado en la nube. Entra con tu <b>nombre de pintor</b> y la <b>contraseña</b> de la app (Perfil → Mi cuenta en la nube).</p>
      <input id="user" placeholder="Nombre de pintor" autocomplete="username">
      <input id="pass" type="password" placeholder="Contraseña" autocomplete="current-password">
      <button class="btn-main" id="go">Ver mi progreso</button>
      <div id="who"></div>
      <div class="err" id="err"></div>
    </div>
  </div>

  <div id="app">
    <header>
      <div class="logo" style="font-size:24px"><span class="p">Pinta</span><span class="m">Mapa</span></div>
      <div class="who"><div class="ring" id="ring"><b id="lvl">1</b></div><div class="who-txt"><b id="name"></b><small id="lvltext"></small></div></div>
      <div class="grow"></div>
      <small class="muted" id="synced" style="font-size:12px"></small>
      <button class="hbtn" id="reload">↻ Actualizar</button>
      <a class="hbtn" href="index.html">🕹️ Jugar</a>
      <button class="hbtn" id="logout">Salir</button>
    </header>
    <div class="mapwrap">
      <div id="bigmap"></div>
      <div class="layers" id="layers"></div>
      <button class="chip fitbtn" id="fit">⤢ Ver todo</button>
      <div class="mapstats" id="mapstats"></div>
    </div>
    <aside>
      <div class="tabs" id="tabs">
        <button data-t="res" class="on">Resumen</button>
        <button data-t="act">Actividad</button>
        <button data-t="pas">Paseos</button>
        <button data-t="con">Conquistas</button>
      </div>
      <div id="panel" style="display:flex;flex-direction:column;gap:14px"></div>
    </aside>
  </div>

  <script src="lib/maplibre/maplibre-gl.js"></script>
  <script src="js/version.js"></script>
  <script src="js/util.js"></script>
  <script src="js/wikidata.js"></script>
  <script src="js/vtiles.js"></script>
  <script src="js/mapstyle.js"></script>
  <script src="js/world.js"></script>
  <script src="js/game.js"></script>
  <script src="js/merge.js"></script>
  <script src="js/sync.js"></script>
  <script src="lib/html-to-image.js"></script>
  <script src="js/tcg.js"></script>
  <script src="lib/mp4-muxer.js"></script>
  <script src="js/replay.js"></script>
  <script>
  (function () {
    const $ = (s) => document.querySelector(s);
    const KEY = 'pintamapa_dash';
    const MIN_WALK = 120000;   // los paseos de menos de 2 minutos no cuentan
    let creds = {}; try { creds = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
    let data, map, layers = {}, selLayer = null, tab = 'res', fitBounds = null;
    const esc = (t) => String(t == null ? '' : t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const km = (m) => (m / 1000).toFixed(m >= 10000 ? 1 : 2);
    const dist = (m) => PM.fmtDist(m || 0);
    const dur = (ms) => { const m = Math.round(ms / 60000); return m >= 60 ? Math.floor(m / 60) + ' h ' + (m % 60) + ' min' : m + ' min'; };
    const pace = (ms, m) => { if (!m || m < 50) return '—'; const s = ms / 1000 / (m / 1000); return Math.floor(s / 60) + ':' + String(Math.round(s % 60)).padStart(2, '0') + ' /km'; };
    const dayKey = (t) => { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
    const RAR = PM.world.RARITY;
    const RAR_C = { comun: '#9aa4b2', raro: '#3fa9ff', epico: '#b65cff', legendario: '#ffb700' };

    // ---------------- acceso ----------------
    async function load() {
      $('#err').textContent = ''; $('#who').innerHTML = '';
      try {
        if (!creds.user || !creds.pass) throw new Error('Pon tu nombre de pintor y tu contraseña');
        $('#go').textContent = 'Descifrando…';
        let r;
        try { r = await PM.cloud.load(creds.user, creds.pass); }
        catch (e) { throw new Error(e.name === 'OperationError' ? 'Contraseña incorrecta' : (e.message || 'Error')); }
        if (!r) {
          $('#who').innerHTML = `<div class="howto"><b>No encuentro la partida de «${esc(creds.user)}» con esa contraseña.</b><ol>
            <li>Revisa nombre y contraseña (las mayúsculas cuentan).</li>
            <li>En el móvil: tu nombre → arriba <b>📡 Real</b> → <b>🎨 Perfil → ☁️ Mi cuenta en la nube</b> → contraseña → <b>Activar y guardar</b>.</li></ol></div>`;
          return;
        }
        localStorage.setItem(KEY, JSON.stringify(creds));
        data = { save: r.save, geo: r.geo, photo: r.photo };
        $('#login').style.display = 'none'; $('#app').classList.add('show');
        analyze(); header(); drawMap(); drawPanel();
      } catch (e) {
        $('#err').textContent = e.message === 'Failed to fetch' ? 'Sin conexión' : e.message;
      } finally { $('#go').textContent = 'Ver mi progreso'; }
    }
    $('#go').addEventListener('click', () => { creds = { user: $('#user').value.trim(), pass: $('#pass').value }; load(); });
    $('#pass').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#go').click(); });
    $('#logout').addEventListener('click', () => { localStorage.removeItem(KEY); location.reload(); });
    $('#reload').addEventListener('click', load);
    if (creds.user && creds.pass) { $('#user').value = creds.user; load(); }

    // ---------------- análisis ----------------
    let A = {};
    const xpFor = (l) => Math.round(400 * Math.pow(l - 1, 1.6));
    function analyze() {
      const s = data.save, st = s.stats || {};
      const walks = (s.walks || []).filter((w) => (w.elapsed || 0) >= MIN_WALK).sort((a, b) => b.start - a.start);
      const totMs = walks.reduce((a, w) => a + w.elapsed, 0);
      const wWalked = walks.reduce((a, w) => a + (w.st.walked || 0), 0);
      const wPainted = walks.reduce((a, w) => a + (w.st.painted || 0), 0);
      const days = {};
      walks.forEach((w) => { const k = dayKey(w.start); const d = days[k] || (days[k] = { walked: 0, painted: 0, pts: 0, ms: 0, n: 0 }); d.walked += w.st.walked || 0; d.painted += w.st.painted || 0; d.pts += w.st.pts || 0; d.ms += w.elapsed; d.n++; });
      // rachas
      const dk = Object.keys(days).sort();
      let maxStreak = 0, cur = 0, prev = null;
      for (const k of dk) { const t = new Date(k).getTime(); cur = prev != null && Math.round((t - prev) / 86400000) === 1 ? cur + 1 : 1; maxStreak = Math.max(maxStreak, cur); prev = t; }
      const hours = new Array(24).fill(0), wdays = new Array(7).fill(0);
      walks.forEach((w) => { const d = new Date(w.start); hours[d.getHours()] += (w.st.walked || 0) / 1000; wdays[(d.getDay() + 6) % 7] += (w.st.walked || 0) / 1000; });
      const rec = (f) => walks.slice().sort((a, b) => f(b) - f(a))[0];
      const fastest = walks.filter((w) => (w.st.walked || 0) > 300).sort((a, b) => (a.elapsed / a.st.walked) - (b.elapsed / b.st.walked))[0];
      const bestDay = Object.entries(days).sort((a, b) => b[1].painted - a[1].painted)[0];
      // ciudades
      const byCity = {};
      for (const [k, v] of Object.entries(s.tileNames || {})) if (v.city) byCity[v.city] = (byCity[v.city] || 0) + ((s.paintedByTile || {})[k] || 0);
      const cities = Object.entries(byCity).filter(([, m]) => m > 0).map(([c, m]) => {
        const tot = s.cities && s.cities[c] && s.cities[c].total;
        return { c, m, tot, pct: tot ? m / tot : 0, won: !!(s.citiesWon || {})[c] };
      }).sort((a, b) => b.m - a.m);
      // ritmo de pintura reciente (últimos 30 días) → proyección
      const since = Date.now() - 30 * 86400000;
      const rec30 = walks.filter((w) => w.start >= since);
      const activeDays30 = new Set(rec30.map((w) => dayKey(w.start))).size;
      const painted30 = rec30.reduce((a, w) => a + (w.st.painted || 0), 0);
      const perDay = painted30 / 30;
      const lms = Object.entries(s.landmarks || {}).map(([id, v]) => Object.assign({ id }, v));
      const LI = PM.levelInfo(s.xp), lvl = LI.level;
      A = { s, st, walks, totMs, wWalked, wPainted, days, maxStreak, hours, wdays, cities, perDay, activeDays30, painted30, lms, lvl, LI,
        longest: rec((w) => w.st.walked || 0), topPts: rec((w) => w.st.pts || 0), fastest, bestDay,
        eff: (st.walkedM || 0) > 0 ? (st.paintedM || 0) / st.walkedM : 0 };
    }

    function header() {
      const { s, LI } = A;
      const p = LI.pct * 100;
      $('#ring').style.setProperty('--p', p.toFixed(1)); $('#lvl').textContent = LI.short; $('#lvl').style.color = LI.tier ? LI.tier.color : '';
      $('#name').textContent = s.player || creds.user;
      $('#lvltext').textContent = `Nivel ${LI.label}${LI.tier ? ' ' + LI.tier.icon : ''} · ${PM.fmtNum(s.xp || 0)} pts · ` + (LI.max ? '¡nivel máximo!' : `faltan ${PM.fmtNum(LI.need - LI.cur)} para el ${LI.nextLabel}`);
      $('#synced').textContent = s.syncedAt ? 'Actualizado ' + new Date(s.syncedAt).toLocaleString('es-ES', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
      document.documentElement.style.setProperty('--paint', s.color || '#ff2e88');
    }

    // ---------------- mapa (MapLibre: mapa vectorial de OpenFreeMap, como en la app) ----------------
    const ll = (q) => [q[1], q[0]];
    const FC = (features) => ({ type: 'FeatureCollection', features });
    const lineF = (pts, props) => ({ type: 'Feature', properties: props || {}, geometry: { type: 'LineString', coordinates: pts.map(ll) } });
    const circlePoly = (c, r) => {
      const out = [], kLat = r / 111320, kLon = r / (111320 * Math.cos(c[0] * Math.PI / 180));
      for (let i = 0; i <= 40; i++) { const a = i / 40 * 2 * Math.PI; out.push([c[1] + Math.sin(a) * kLon, c[0] + Math.cos(a) * kLat]); }
      return { type: 'Feature', properties: {}, geometry: { type: 'Polygon', coordinates: [out] } };
    };
    let lmMarkers = [], mapLoaded = null;
    // grupos de capas que se encienden/apagan con los botones de encima del mapa
    const GROUPS = { calles: ['pv-glow', 'pv-paint'], rutas: ['pv-walks'], monumentos: ['pv-halo-fill', 'pv-halo-line'], barrios: ['pv-barrios'] };
    function setData(id, fc) {
      if (map.getSource(id)) map.getSource(id).setData(fc);
      else map.addSource(id, { type: 'geojson', data: fc });
    }
    async function drawMap() {
      const { s, walks, lms } = A;
      const color = s.color || '#2563eb';
      if (!map) {
        map = new maplibregl.Map({ container: 'bigmap', style: PM.mapStyle.URL.light, center: [2.07386, 41.35763], zoom: 14,
          attributionControl: false, dragRotate: false, pitchWithRotate: false });
        map.touchZoomRotate.disableRotation();
        map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-right');
        map.addControl(new maplibregl.AttributionControl({ compact: true, customAttribution: '© OpenStreetMap · OpenFreeMap' }), 'bottom-left');
        mapLoaded = new Promise((r) => map.on('load', r));
        map.on('style.load', () => PM.mapStyle.enhance(map, 'light'));
      }
      await mapLoaded;
      const bounds = new maplibregl.LngLatBounds();
      const ext = (pts) => pts.forEach((q) => bounds.extend(ll(q)));
      // calles pintadas
      const geo = Object.values(data.geo || {});
      setData('pv-painted', FC(geo.map((g) => lineF(g))));
      geo.forEach(ext);
      // recorridos (más recientes, más intensos)
      const wf = [];
      walks.forEach((w, i) => splitTrack(w.track).forEach((sg) => { wf.push(lineF(sg, { o: Math.max(0.15, 0.55 - i * 0.04) })); ext(sg); }));
      setData('pv-walks', FC(wf));
      // monumentos: halo + marcador (toca para ver la carta)
      setData('pv-halos', FC(lms.filter((v) => v.pos).map((v) => circlePoly(v.pos, 45))));
      // barrios conquistados (silueta)
      const bf = [];
      Object.values(s.barrioCards || {}).forEach((bc) => (bc.lines || []).forEach((ln) => bf.push(lineF(ln))));
      setData('pv-barrios', FC(bf));
      // recorrido seleccionado
      setData('pv-sel', FC([]));
      const first = (map.getStyle().layers || []).find((l) => l.type === 'symbol');
      const add = (l) => { if (!map.getLayer(l.id)) map.addLayer(l, first && first.id); };
      const round = { 'line-cap': 'round', 'line-join': 'round' };
      add({ id: 'pv-barrios', type: 'line', source: 'pv-barrios', paint: { 'line-color': '#8b5cf6', 'line-width': 3, 'line-opacity': 0.55 } });
      add({ id: 'pv-glow', type: 'line', source: 'pv-painted', layout: round, paint: { 'line-color': color, 'line-width': ['interpolate', ['linear'], ['zoom'], 12, 4, 17, 14], 'line-opacity': 0.18, 'line-blur': 4 } });
      add({ id: 'pv-paint', type: 'line', source: 'pv-painted', layout: round, paint: { 'line-color': color, 'line-width': ['interpolate', ['linear'], ['zoom'], 12, 1.5, 17, 4.5] } });
      add({ id: 'pv-walks', type: 'line', source: 'pv-walks', paint: { 'line-color': '#2563eb', 'line-width': 2, 'line-opacity': ['get', 'o'], 'line-dasharray': [2, 3] } });
      add({ id: 'pv-halo-fill', type: 'fill', source: 'pv-halos', paint: { 'fill-color': color, 'fill-opacity': 0.12 } });
      add({ id: 'pv-halo-line', type: 'line', source: 'pv-halos', paint: { 'line-color': color, 'line-width': 1.5 } });
      add({ id: 'pv-sel-casing', type: 'line', source: 'pv-sel', layout: round, paint: { 'line-color': '#fff', 'line-width': 9, 'line-opacity': 0.9 } });
      add({ id: 'pv-sel', type: 'line', source: 'pv-sel', layout: round, paint: { 'line-color': '#2563eb', 'line-width': 5 } });
      lmMarkers.forEach((m) => m.remove()); lmMarkers = [];
      lms.filter((v) => v.pos).forEach((v) => {
        const el = document.createElement('div');
        el.innerHTML = `<div class="lmk" style="--c:${RAR_C[v.rarity]}" title="${esc(v.name)}">${v.emoji}</div>`;
        el.addEventListener('click', (e) => { e.stopPropagation(); openCard(v.id); });
        lmMarkers.push(new maplibregl.Marker({ element: el }).setLngLat(ll(v.pos)).addTo(map));
        bounds.extend(ll(v.pos));
      });
      const layers = { calles: { name: 'Calles pintadas', dot: color }, rutas: { name: 'Recorridos', dot: '#2563eb' }, monumentos: { name: 'Monumentos', dot: '#ffb700' }, barrios: { name: 'Barrios 🚩', dot: '#8b5cf6' } };
      $('#layers').innerHTML = Object.entries(layers).map(([k, l]) => `<button class="chip on" data-l="${k}"><i style="background:${l.dot}"></i>${l.name}</button>`).join('');
      document.querySelectorAll('[data-l]').forEach((el) => el.addEventListener('click', () => {
        const on = !el.classList.contains('on'); el.classList.toggle('on', on);
        GROUPS[el.dataset.l].forEach((id) => map.getLayer(id) && map.setLayoutProperty(id, 'visibility', on ? 'visible' : 'none'));
        if (el.dataset.l === 'monumentos') lmMarkers.forEach((m) => (m.getElement().style.display = on ? '' : 'none'));
      }));
      fitBounds = bounds.isEmpty() ? null : bounds;
      fit();
      setTimeout(() => map.resize(), 60);
      const st = A.st;
      $('#mapstats').innerHTML = [[dist(st.paintedM), 'pintados'], [lms.length, 'monumentos'], [Object.keys(s.conqueredB || {}).length, 'barrios 🚩']]
        .map(([b, t]) => `<div class="mapstat"><b>${b}</b><small>${t}</small></div>`).join('');
    }
    // ---------------- carta coleccionable (estilo TCG) ----------------
    function cardData(id) {
      const s = A.s, v = s.landmarks[id], info = (s.cardInfo || {})[id] || {};
      const order = Object.keys(s.landmarks).sort((a, b) => s.landmarks[a].t - s.landmarks[b].t);
      return { id, name: v.name, kind: v.kind, emoji: v.emoji, rarity: v.rarity, city: v.city, barrio: v.barrio, t: v.t, visits: v.visits, wiki: v.wiki, wd: v.wd, pos: v.pos, color: s.color,
        img: info.img, text: info.text, credit: info.credit, points: 100 * ((RAR[v.rarity] || {}).mult || 1),
        number: order.indexOf(id) + 1, total: order.length, player: s.player || creds.user };
    }
    const photoCache = {};
    async function ownPhoto(id) {
      if (!(id in photoCache)) photoCache[id] = data.photo ? data.photo(id) : Promise.resolve(null);
      return photoCache[id];
    }
    async function openCard(id) {
      const v = A.s.landmarks[id];
      const d = cardData(id);
      if ((A.s.cardPhotos || {})[id]) { const img = await ownPhoto(id); if (img) { d.img = img; d.own = true; d.credit = 'Foto: ' + (A.s.player || creds.user); } }
      PM.tcg.open(d, { actions: [{ label: '📍 Ver en el mapa', on: () => { PM.tcg.close(); if (v.pos) map.flyTo({ center: ll(v.pos), zoom: 18 }); } }] });
    }

    function fit() { if (fitBounds) map.fitBounds(fitBounds, { padding: 60, maxZoom: 17, duration: 0 }); else map.jumpTo({ center: [2.07386, 41.35763], zoom: 15 }); }
    $('#fit').addEventListener('click', () => { if (map.getSource('pv-sel')) map.getSource('pv-sel').setData(FC([])); document.querySelectorAll('.walk').forEach((x) => x.classList.remove('sel')); fit(); });
    function splitTrack(t) {
      const segs = []; let cur = [];
      (t || []).forEach((p) => { if (!p) { if (cur.length > 1) segs.push(cur); cur = []; } else cur.push(p); });
      if (cur.length > 1) segs.push(cur);
      return segs;
    }
    function showWalk(w, el) {
      document.querySelectorAll('.walk').forEach((x) => x.classList.remove('sel'));
      if (el) el.classList.add('sel');
      const segs = splitTrack(w.track);
      if (!segs.length || !map.getSource('pv-sel')) return;
      map.getSource('pv-sel').setData(FC(segs.map((sg) => lineF(sg))));
      const bb = new maplibregl.LngLatBounds(); segs.forEach((sg) => sg.forEach((q) => bb.extend(ll(q))));
      map.fitBounds(bb, { padding: 80, maxZoom: 18 });
    }

    // ---------------- gráficos (SVG) ----------------
    function bars(values, labels, opts = {}) {
      const W = 400, H = opts.h || 120, pad = 18, n = values.length, max = Math.max(1e-9, ...values.map((v) => (Array.isArray(v) ? Math.max(...v) : v)));
      const bw = (W - pad) / n;
      let svg = `<svg viewBox="0 0 ${W} ${H + 18}" width="100%" style="display:block">`;
      for (let i = 0; i < n; i++) {
        const vs = Array.isArray(values[i]) ? values[i] : [values[i]];
        vs.forEach((v, j) => {
          const h = Math.max(v > 0 ? 2 : 0, (v / max) * (H - 6));
          const w = (bw - 3) / vs.length;
          svg += `<rect x="${(pad / 2 + i * bw + j * w).toFixed(1)}" y="${(H - h).toFixed(1)}" width="${Math.max(1, w - 1).toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${(opts.colors || ['var(--paint)'])[j]}"><title>${labels[i]}: ${opts.fmt ? opts.fmt(v) : v}</title></rect>`;
        });
        if (labels[i] && (!opts.every || i % opts.every === 0)) svg += `<text x="${(pad / 2 + i * bw + bw / 2).toFixed(1)}" y="${H + 14}" font-size="10" fill="#9ca3af" text-anchor="middle">${labels[i]}</text>`;
      }
      return svg + '</svg>';
    }
    function donut(parts) {
      const tot = parts.reduce((a, p) => a + p.v, 0) || 1;
      let a0 = -Math.PI / 2, svg = '<svg viewBox="0 0 120 120" width="120" height="120">';
      parts.forEach((p) => {
        if (!p.v) return;
        const a1 = a0 + (p.v / tot) * Math.PI * 2, large = a1 - a0 > Math.PI ? 1 : 0;
        const P = (a, r) => [60 + r * Math.cos(a), 60 + r * Math.sin(a)];
        const [x0, y0] = P(a0, 52), [x1, y1] = P(a1, 52), [x2, y2] = P(a1, 34), [x3, y3] = P(a0, 34);
        svg += p.v === tot ? `<circle cx="60" cy="60" r="43" fill="none" stroke="${p.c}" stroke-width="18"/>`
          : `<path d="M${x0},${y0} A52,52 0 ${large} 1 ${x1},${y1} L${x2},${y2} A34,34 0 ${large} 0 ${x3},${y3} Z" fill="${p.c}"/>`;
        a0 = a1;
      });
      return svg + `<text x="60" y="64" text-anchor="middle" font-size="18" font-weight="800" fill="#111827">${tot === 1 && !parts.some((p) => p.v) ? 0 : tot}</text></svg>`;
    }
    function calendar() {
      const days = A.days, max = Math.max(1, ...Object.values(days).map((d) => d.painted));
      const end = new Date(); end.setHours(0, 0, 0, 0);
      const start = new Date(end.getTime() - 25 * 7 * 86400000); start.setDate(start.getDate() - ((start.getDay() + 6) % 7));
      let html = '<div class="cal">';
      for (let t = start.getTime(); t <= end.getTime(); t += 86400000) {
        const d = days[dayKey(t)], v = d ? d.painted / max : 0;
        const bg = d ? `rgba(255,46,136,${(0.25 + v * 0.75).toFixed(2)})` : '';
        html += `<i title="${new Date(t).toLocaleDateString('es-ES')}${d ? ': ' + dist(d.painted) + ' pintados' : ''}" ${bg ? `style="background:${bg}"` : ''}></i>`;
      }
      return html + '</div>';
    }

    // ---------------- panel ----------------
    document.querySelectorAll('#tabs button').forEach((b) => b.addEventListener('click', () => {
      tab = b.dataset.t; document.querySelectorAll('#tabs button').forEach((x) => x.classList.toggle('on', x === b)); drawPanel();
    }));
    function kpi(v, l, extra, hl) { return `<div class="kpi ${hl ? 'hl' : ''}"><b>${v}</b><small>${l}</small>${extra ? `<div><em>${extra}</em></div>` : ''}</div>`; }

    function drawPanel() {
      const P = $('#panel');
      const { s, st, walks, totMs, wWalked, days, cities, lms } = A;
      let h = '';
      if (tab === 'res') {
        h += `<div class="kpis">
          ${kpi(km(st.paintedM || 0) + ' km', 'calles pintadas', '', true)}
          ${kpi(km(st.walkedM || 0) + ' km', 'caminados')}
          ${kpi(Math.round(A.eff * 100) + ' %', 'calle nueva por km', A.eff > 0.7 ? 'explorador' : '')}
          ${kpi(walks.length, 'paseos (≥ 2 min)')}
          ${kpi(dur(totMs), 'en la calle')}
          ${kpi(pace(totMs, wWalked), 'ritmo medio')}
          ${kpi(totMs ? ((wWalked / 1000) / (totMs / 3600000)).toFixed(1) + ' km/h' : '—', 'velocidad media')}
          ${kpi(PM.fmtNum(s.xp || 0), 'puntos')}
          ${kpi((st.walkedM ? Math.round((s.xp || 0) / (st.walkedM / 1000)) : 0), 'puntos por km')}
          ${kpi('🔥 ' + (st.streak || 0), 'racha actual', 'máx. ' + A.maxStreak + ' días')}
          ${kpi('x' + (st.bestCombo || 0), 'mejor combo')}
          ${kpi(Object.keys(days).length, 'días activos')}
        </div>`;
        // proyección y análisis
        h += `<div class="card"><h3>Análisis <span>últimos 30 días</span></h3>${insights()}</div>`;
        h += `<div class="card"><h3>Ciudades <span>objetivo 80 %</span></h3>${cities.length ? cities.map((c) => `
          <div style="margin-bottom:12px"><div class="row" style="border:0;padding:0"><b>${c.won ? '👑 ' : ''}${esc(c.c)}</b><b>${c.tot ? (c.pct * 100).toFixed(2) + ' %' : dist(c.m)}</b></div>
          <div class="pbar"><i style="width:${Math.min(100, c.pct * 100)}%"></i><em></em></div>
          <small class="muted">${dist(c.m)} de ${c.tot ? dist(c.tot) : '?'}${c.tot ? ' · faltan ' + dist(Math.max(0, c.tot * 0.8 - c.m)) + ' para conquistarla' : ''}</small></div>`).join('') : '<div class="empty">Aún sin ciudades.</div>'}</div>`;
        h += `<div class="card"><h3>Récords</h3>
          <div class="row"><span>🏃 Paseo más largo</span><b>${A.longest ? dist(A.longest.st.walked) : '—'}</b></div>
          <div class="row"><span>⚡ Paseo más rápido</span><b>${A.fastest ? pace(A.fastest.elapsed, A.fastest.st.walked) : '—'}</b></div>
          <div class="row"><span>⭐ Más puntos en un paseo</span><b>${A.topPts ? '+' + PM.fmtNum(A.topPts.st.pts) : '—'}</b></div>
          <div class="row"><span>📅 Mejor día</span><b>${A.bestDay ? dist(A.bestDay[1].painted) + ' · ' + new Date(A.bestDay[0]).toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }) : '—'}</b></div>
          <div class="row"><span>🔥 Racha más larga</span><b>${A.maxStreak} días</b></div></div>`;
      }
      if (tab === 'act') {
        const N = 30, vals = [], labs = [];
        for (let i = N - 1; i >= 0; i--) { const t = Date.now() - i * 86400000, d = days[dayKey(t)]; vals.push([d ? d.walked / 1000 : 0, d ? d.painted / 1000 : 0]); labs.push(new Date(t).getDate()); }
        h += `<div class="card"><h3>Últimos 30 días <span>km</span></h3>${bars(vals, labs, { colors: ['#c7d2fe', 'var(--paint)'], every: 5, fmt: (v) => v.toFixed(2) + ' km' })}
          <div class="legend"><span><i style="background:#c7d2fe"></i>caminado</span><span><i style="background:var(--paint)"></i>pintado</span></div></div>`;
        h += `<div class="card"><h3>Calendario <span>6 meses</span></h3>${calendar()}</div>`;
        h += `<div class="grid2">
          <div class="card"><h3>Hora del día</h3>${bars(A.hours, A.hours.map((_, i) => i), { every: 6, h: 90, fmt: (v) => v.toFixed(2) + ' km' })}</div>
          <div class="card"><h3>Día de la semana</h3>${bars(A.wdays, ['L', 'M', 'X', 'J', 'V', 'S', 'D'], { h: 90, colors: ['var(--cyan)'], fmt: (v) => v.toFixed(2) + ' km' })}</div></div>`;
        const lastW = walks.slice(0, 20).reverse();
        h += `<div class="card"><h3>Evolución por paseo <span>últimos ${lastW.length}</span></h3>${lastW.length ? bars(lastW.map((w) => (w.st.painted || 0) / 1000), lastW.map((w) => new Date(w.start).getDate() + '/' + (new Date(w.start).getMonth() + 1)), { every: Math.ceil(lastW.length / 6), fmt: (v) => v.toFixed(2) + ' km pintados' }) : '<div class="empty">Sin paseos aún.</div>'}</div>`;
      }
      if (tab === 'pas') {
        h += `<div class="card" style="padding:8px"><h3 style="padding:8px 8px 0">Paseos <span>${walks.length} · toca uno para verlo en el mapa</span></h3>` + (walks.length ? walks.map((w, i) => `
          <div class="walk" data-i="${i}"><b>${new Date(w.start).toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short' })} · ${new Date(w.start).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' })}</b>
          <div class="pts">+${PM.fmtNum(w.st.pts || 0)}</div>
          <small>⏱ ${dur(w.elapsed)} · 🚶 ${dist(w.st.walked)} · 🖌️ ${dist(w.st.painted)} nuevos · ⚡ ${pace(w.elapsed, w.st.walked)} · 📸 ${w.st.captures || 0}${w.st.conquests ? ' · 🚩 ' + w.st.conquests : ''}${w.imported ? ' · ⌚' : ''}</small>
          <button class="wdet" data-w="${i}">📊 Estadísticas, vídeo y exportar</button></div>`).join('')
          : '<div class="empty">Aún no hay paseos de más de 2 minutos.</div>') + '</div>';
      }
      if (tab === 'con') {
        const byR = ['legendario', 'epico', 'raro', 'comun'].map((r) => ({ r, v: lms.filter((l) => l.rarity === r).length, c: RAR_C[r] }));
        const byK = {}; lms.forEach((l) => { byK[l.kind] = (byK[l.kind] || 0) + 1; });
        h += `<div class="card"><h3>Monumentos <span>${lms.length} conquistados · ${Object.keys(s.cardPhotos || {}).length} con foto propia</span></h3>
          <div style="display:flex;gap:16px;align-items:center">${donut(byR.map((x) => ({ v: x.v, c: x.c })))}
          <div style="flex:1">${byR.map((x) => `<div class="row"><span><i style="display:inline-block;width:9px;height:9px;border-radius:3px;background:${x.c};margin-right:6px"></i>${RAR[x.r].label}</span><b>${x.v}</b></div>`).join('')}</div></div></div>`;
        h += `<div class="card"><h3>Por tipo</h3>${Object.keys(byK).length ? Object.entries(byK).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<div class="row"><span>${esc(k)}</span><b>${v}</b></div>`).join('') : '<div class="empty">Quédate 10 s junto a un monumento para conquistarlo.</div>'}</div>`;
        const byCity = {}; lms.forEach((l) => { (byCity[l.city || 'Otros lugares'] = byCity[l.city || 'Otros lugares'] || []).push(l); });
        h += `<div class="card"><h3>Cartas <span>por ciudad · toca una para verla</span></h3>${lms.length ? Object.entries(byCity).sort((a, b) => b[1].length - a[1].length).map(([c, list]) =>
          `<h4 class="city-h">🏙️ ${esc(c)} <span>${list.length}</span></h4><div class="tcggrid">` + list.sort((a, b) => b.t - a.t).map((l) =>
          `<div class="tcg-cell" data-lm="${l.id}">${PM.tcg.html(cardData(l.id), { mini: true })}</div>`).join('') + '</div>').join('') : '<div class="empty">Sin cartas aún.</div>'}</div>`;
        const ach = PM.game.ACHIEVEMENTS, got = s.achievements || {};
        h += `<div class="card"><h3>Logros <span>${Object.keys(got).filter((k) => ach[k]).length}/${Object.keys(ach).length}</span></h3><div class="ach">${Object.entries(ach).map(([id, a]) =>
          `<div class="${got[id] ? '' : 'off'}" title="${esc(a.desc)}"><span>${a.icon}</span>${esc(a.name)}</div>`).join('')}</div></div>`;
        const bc = Object.values(s.barrioCards || {});
        h += `<div class="card"><h3>Barrios conquistados <span>${bc.length}</span></h3>${bc.length ? bc.map((b) => `<div class="row"><span>🚩 ${esc(b.name)}</span><b>${new Date(b.t).toLocaleDateString('es-ES')}</b></div>`).join('') : '<div class="empty">Pinta el 80 % de un barrio para conquistarlo.</div>'}</div>`;
      }
      P.innerHTML = h;
      P.querySelectorAll('.walk').forEach((el) => el.addEventListener('click', () => showWalk(walks[+el.dataset.i], el)));
      P.querySelectorAll('.wdet').forEach((b) => b.addEventListener('click', (e) => { e.stopPropagation(); PM.replay.open(walks[+b.dataset.w], { geo: data.geo, color: A.s.color, player: A.s.player || creds.user }); }));
      // tus fotos de cromo (de la nube): se ponen en las cartas en cuanto llegan
      P.querySelectorAll('.tcg-cell[data-lm]').forEach(async (el) => {
        const id = el.dataset.lm;
        if (!(A.s.cardPhotos || {})[id]) return;
        const img = await ownPhoto(id);
        const ph = img && el.querySelector('.tcg-photo');
        if (ph) { ph.style.backgroundImage = `url('${img}')`; ph.innerHTML = ''; }
      });
      P.querySelectorAll('[data-lm]').forEach((el) => el.addEventListener('click', () => openCard(el.dataset.lm)));
    }

    function insights() {
      const { st, walks, cities, perDay, activeDays30, painted30, eff, hours, wdays } = A;
      const out = [];
      if (!walks.length) return '<div class="empty">Sal a dar tu primer paseo y aquí verás tu análisis.</div>';
      out.push(['📆', `Has salido <b>${activeDays30} de los últimos 30 días</b> y has pintado <b>${dist(painted30)}</b> de calles nuevas.`]);
      const city = cities.find((c) => c.tot && !c.won);
      if (city) {
        const left = Math.max(0, city.tot * 0.8 - city.m);
        out.push(['🎯', perDay > 0 ? `A tu ritmo (${dist(perDay)} al día), conquistarás <b>${esc(city.c)}</b> en unos <b>${Math.ceil(left / perDay)} días</b>.`
          : `Te faltan <b>${dist(left)}</b> para conquistar <b>${esc(city.c)}</b>.`]);
      }
      out.push(['🧭', eff >= 0.7 ? `El <b>${Math.round(eff * 100)} %</b> de lo que andas es calle nueva: ¡explorador nato!` :
        `Solo el <b>${Math.round(eff * 100)} %</b> de lo que andas es calle nueva. Prueba rutas distintas para pintar más rápido.`]);
      const hBest = hours.indexOf(Math.max(...hours)), dBest = wdays.indexOf(Math.max(...wdays));
      out.push(['⏰', `Sueles salir sobre las <b>${hBest}:00</b>, y tu mejor día es el <b>${['lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado', 'domingo'][dBest]}</b>.`]);
      const kcal = Math.round((st.walkedM || 0) / 1000 * 55);
      out.push(['❤️', `Unos <b>${PM.fmtNum(Math.round((st.walkedM || 0) / 0.75))} pasos</b> y <b>${PM.fmtNum(kcal)} kcal</b> estimadas desde que juegas.`]);
      return out.map(([i, t]) => `<div class="insight"><div class="ic">${i}</div><div>${t}</div></div>`).join('');
    }
  })();
  </script>
</body>
